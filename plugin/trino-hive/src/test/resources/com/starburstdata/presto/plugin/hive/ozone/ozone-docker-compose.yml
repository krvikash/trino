version: "3"
networks:
   external_network:
      external:
         name: ${NETWORK_ID}
services:
   datanode:
      image: apache/ozone:1.4.0
      ports:
         - 9864
      command: ["ozone","datanode"]
      env_file:
         - ${OZONE_ENVIRONMENT_FILE}
      networks:
         - external_network
   ozone-manager:
      image: apache/ozone:1.4.0
      ports:
         - 9862
         - 9874
      env_file:
         - ${OZONE_ENVIRONMENT_FILE}
      environment:
         ENSURE_OM_INITIALIZED: /data/metadata/om/current/VERSION
         WAITFOR: storage-container-manager:9876
      command: ["ozone","om"]
      networks:
         - external_network
   storage-container-manager:
      image: apache/ozone:1.4.0
      ports:
         - 9876
      env_file:
         - ${OZONE_ENVIRONMENT_FILE}
      environment:
         ENSURE_SCM_INITIALIZED: /data/metadata/scm/current/VERSION
      command: ["ozone","scm"]
      networks:
         - external_network
   recon:
      image: apache/ozone:1.4.0
      ports:
         - 9888
      env_file:
         - ${OZONE_ENVIRONMENT_FILE}
      command: ["ozone","recon"]
      networks:
         - external_network
   s3-gateway:
      image: apache/ozone:1.4.0
      ports:
         - 9878
      env_file:
         - ${OZONE_ENVIRONMENT_FILE}
      command: ["ozone","s3g"]
      networks:
         - external_network
