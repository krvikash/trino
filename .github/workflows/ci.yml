        if: contains(matrix.modules, 'starburst-salesforce')
        env:
          SALESFORCE_BASIC_AUTH_USER_USERNAME: ${{ vars.SALESFORCE_BASIC_AUTH_USER_USERNAME }}
          SALESFORCE_BASIC_AUTH_USER_PASSWORD: ${{ secrets.SALESFORCE_BASIC_AUTH_USER_PASSWORD }}
          SALESFORCE_BASIC_AUTH_USER_SECURITY_TOKEN: ${{ secrets.SALESFORCE_BASIC_AUTH_USER_SECURITY_TOKEN }}
        run: |
          export MAVEN_OPTS="${MAVEN_INSTALL_OPTS}"
          $MAVEN test ${MAVEN_TEST} -pl ${{ matrix.modules }} \
            -Dsalesforce.test.basic.auth.user="${SALESFORCE_BASIC_AUTH_USER_USERNAME}" \
            -Dsalesforce.test.basic.auth.password="${SALESFORCE_BASIC_AUTH_USER_PASSWORD}" \
            -Dsalesforce.test.basic.auth.security-token="${SALESFORCE_BASIC_AUTH_USER_SECURITY_TOKEN}"
      - name: Sanitize artifact name
        if: always()
        run: |
          # Generate a valid artifact name and make it available to next steps as
          # an environment variable ARTIFACT_NAME
          # ", :, <, >, |, *, ?, \, / are not allowed in artifact names, replace it with an underscore
          name=$(echo -n "${{ matrix.modules }}" | sed -e 's/[":<>|\*\?\\\/]/_/g')
          echo "ARTIFACT_NAME=$name" >> $GITHUB_ENV
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: results ${{ env.ARTIFACT_NAME }}
          path: |
            **/target/surefire-reports
            **/target/checkstyle-*
            **/*.hprof
          retention-days: 30
      - name: Annotate with test report
        uses: trinodb/github-actions/action-surefire-report@b63800bedfbc7ab1ff2e5fe7eaecf5ab82ce6a70
        if: failure()
        with:
          # this workflow should never fail, as it is not a quality gateway
          fail_if_no_tests: false
          skip_publishing: true
      - name: Should notify on failure
        if: always() && steps.tests.outcome == 'failure'
        run: |
          # GITHUB_HEAD_REF is only populated for pull requests runs, for scheduled runs extract the name from GITHUB_REF
          branch_name="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "branch=$branch_name" >> "${GITHUB_OUTPUT}"
          if [[ $branch_name == "master" || $branch_name =~ ^release-.*-e$ ]]; then
            echo "result=true" >> "${GITHUB_OUTPUT}"
          else
            echo "result=false" >> "${GITHUB_OUTPUT}"
          fi
        id: should_notify
      - name: Slack notify failed tests to Connectors team
        if: always() && steps.tests.outcome == 'failure' && steps.should_notify.outputs.result == 'true'
        uses: archive/github-actions-slack@433fef9978d3adae73168bfc9c5a7ce722780231 # v3.1.0
        with:
          slack-bot-user-oauth-access-token: ${{ secrets.SLACK_TOKEN }}
          slack-channel: C09HT9ETS73 # galaxy-data-management-notify channel ID
          slack-text: |
            :boom: Salesforce connector tests failed on branch: ${{ steps.should_notify.outputs.branch }} (<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|see CI job for details>) (:thumbsup: this message if you take care of this)
      - name: Launch Flake Tracker
        if: failure() && steps.tests.outcome == 'failure' && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: starburstdata/ai-flake-fixer/.github/actions/launch-ai-flake@main
        with:
          github-access-token: ${{ secrets.GITHUBACCESSTOKEN }}
      - name: Cancel merge queue workflow
        if: ${{ failure() && github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"

  # -----------------------------------------------------------
  # Synapse tests - start a SQL pool if needed
  # nightly tests run on any scheduled run or labeled PR, while
  # weekly and PT only run on labeled PRs or the specific weekly schedule
  # -----------------------------------------------------------
  synapse-prepare:
    name: synapse-prepare
    permissions:
      id-token: write
      contents: read
    runs-on: [ self-hosted, gha-fleet-ec2-2cpu-1gb-arm64, latest ]
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'synapse-smoke') ||
        contains(github.event.pull_request.labels.*.name, 'synapse')
      ))
    outputs:
      matrix: ${{ steps.build-synapse-matrix.outputs.MATRIX }}
      matrix-with-pt: ${{ steps.build-synapse-matrix.outputs.PT_MATRIX }}
      sql-pool-name: ${{ steps.generate-pool-name.outputs.SYNAPSE_SQL_POOL }}
    steps:
      - uses: actions/checkout@v6
      - name: Build matrix
        id: build-synapse-matrix
        env:
          IS_WEEKLY_SCHEDULE: ${{ github.event_name == 'schedule' && github.event.schedule == '0 0 * * 6' }}
          HAS_SYNAPSE_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'synapse') }}
        run: |
          matrix=$(jq -nc '{"include": [{"synapse-test": "smoke"}]}')
          pt_matrix="$matrix"
          if [[ "$IS_WEEKLY_SCHEDULE" == "true" || "$HAS_SYNAPSE_LABEL" == 'true' ]]; then
            matrix=$(echo "$matrix" | jq -c '.include += [
              { "synapse-test": "full", "profile": "fte-tests" },
              { "synapse-test": "full", "profile": "long-running-tests" },
              { "synapse-test": "full", "profile": "type-mapping-tests" }
            ]')
            pt_matrix=$(echo "$matrix" | jq -c '.include += [{"synapse-test": "pt"}]')
          fi
          echo "MATRIX=$matrix" >> $GITHUB_OUTPUT
          echo "PT_MATRIX=$pt_matrix" >> $GITHUB_OUTPUT
      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.SYNAPSE_CLIENT_ID }}
          tenant-id: ${{ secrets.SYNAPSE_TENANT_ID }}
          subscription-id: ${{ secrets.SYNAPSE_SUBSCRIPTION_ID }}
      # Output pool name before starting the pool so the pool can be stopped even if this job is canceled before the pool is fully started
      - name: Generate Pool Name
        id: generate-pool-name
        run: |
          echo "SYNAPSE_SQL_POOL=POOL_$(openssl rand -hex 4)" | tee -a "$GITHUB_OUTPUT"
      - name: Start Pool
        id: start-pool
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        env:
          SYNAPSE_RESOURCE_GROUP: ${{ vars.SYNAPSE_RESOURCE_GROUP }}
          SYNAPSE_WORKSPACE: ${{ vars.SYNAPSE_WORKSPACE }}
          SYNAPSE_SQL_POOL: ${{ steps.generate-pool-name.outputs.SYNAPSE_SQL_POOL }}
        with:
          inlineScript: |
            "$GITHUB_WORKSPACE"/.github/bin/synapse/start-sql-pool.sh
      - name: Cancel merge queue workflow
        if: ${{ failure() && github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"
  synapse-tests:
    name: synapse-tests (${{ matrix.synapse-test }}${{ matrix.profile != '' && format(', {0}', matrix.profile) || '' }})
    runs-on: [ self-hosted, gha-fleet-ec2-4cpu-16gb-arm64, latest ]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-pt.result == 'success' && needs.synapse-prepare.outputs.matrix-with-pt || needs.synapse-prepare.outputs.matrix) }}
    timeout-minutes: 90
    needs: [ build-pt, synapse-prepare ]
    # Skip build-pt success check so nightly and weekly can run regardless
    # Matrix excludes PT cell if build-pt was skipped
    if: always() && needs.synapse-prepare.result == 'success'
    env:
      REPORT_TEST_SESSION_NAME: ${{ matrix.synapse-test == 'pt' && 'pt' || 'modules' }}
      REPORT_SERVICE_NAME: ${{ matrix.synapse-test == 'pt' && 'suite-synapse-default' || 'starburst-synapse' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # checkout all commits, as the build result depends on `git describe` equivalent
      - uses: ./.github/actions/setup
      - name: Set up AWS code-artifacts and ECR logins
        uses: ./.github/actions/starburst-setup
        with:
          aws-access-key-id: ${{ vars.ENG_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ENG_AWS_SECRET_ACCESS_KEY }}
          secret-id: ${{ vars.SEP_SECRETS_AWS_ID }}
          login-docker: ${{ matrix.synapse-test == 'pt' }}
      ### PRODUCT TEST STEPS
      - name: Product tests artifact
        uses: actions/download-artifact@v8
        if: matrix.synapse-test == 'pt'
        with:
          name: product tests and server tarball
      - name: Fix product tests artifact permissions
        if: matrix.synapse-test == 'pt'
        run: |
          find . -type f -name \*-executable.jar -exec chmod 0777 {} \;
      - name: Enable PT impact analysis
        if: |
          matrix.synapse-test == 'pt' &&
          needs.build-pt.outputs.product-tests-changed == 'false' &&
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'tests:all') &&
          !contains(github.event.pull_request.labels.*.name, 'tests:all-product')
        run: echo "PTL_OPTS=--impacted-features impacted-features.log" >> $GITHUB_ENV
      ### PLUGIN TEST STEPS
      - name: Maven install
        if: matrix.synapse-test != 'pt'
        run: |
          export MAVEN_OPTS="${MAVEN_INSTALL_OPTS}"
          $MAVEN clean install ${MAVEN_FAST_INSTALL} -am -pl 'plugin/starburst-synapse'
      ### ANY TEST STEPS
      - name: Run Synapse tests
        id: tests
        env:
          SYNAPSE_ENDPOINT: ${{ vars.SYNAPSE_ENDPOINT }}
          SYNAPSE_USER: ${{ vars.SYNAPSE_USER }}
          SYNAPSE_PASSWORD: ${{ secrets.SYNAPSE_PASSWORD }}
          SYNAPSE_DATABASE: ${{ needs.synapse-prepare.outputs.sql-pool-name }}
        if: |
          env.SYNAPSE_ENDPOINT != '' && env.SYNAPSE_USER != '' && env.SYNAPSE_PASSWORD != ''
        run: |
          if [[ "${{ matrix.synapse-test }}" == "pt" ]]; then
            exec testing/trino-product-tests-launcher/target/trino-product-tests-launcher-*-executable.jar suite run \
              --suite suite-synapse \
              --config config-default \
              ${PTL_OPTS:-} \
              --bind=off --logs-dir logs/ --timeout 80m
          else
            export MAVEN_OPTS="${MAVEN_INSTALL_OPTS}"
            $MAVEN test ${MAVEN_TEST} -pl 'plugin/starburst-synapse' ${{ matrix.profile != '' && format('-P {0}', matrix.profile) || '' }} \
              -Dtest.synapse.jdbc.endpoint="${SYNAPSE_ENDPOINT}" \
              -Dtest.synapse.jdbc.user="${SYNAPSE_USER}" \
              -Dtest.synapse.jdbc.password="${SYNAPSE_PASSWORD}" \
              -Dtest.synapse.jdbc.sqlpool="${SYNAPSE_DATABASE}"
          fi
      - name: Sanitize artifact name
        if: always()
        run: |
          # Generate a valid artifact name and make it available to next steps as
          # an environment variable ARTIFACT_NAME
          # ", :, <, >, |, *, ?, \, / are not allowed in artifact names, replace it with an underscore
          name=$(echo -n "synapse-tests_${{ matrix.synapse-test }}${{ matrix.profile != '' && format('_{0}', matrix.profile) || '' }}" | sed -e 's/[":<>|\*\?\\\/]/_/g')
          echo "ARTIFACT_NAME=$name" >> $GITHUB_ENV
      - name: Upload test results
        uses: ./.github/actions/process-test-results
        if: always()
        with:
          artifact-name: ${{ env.ARTIFACT_NAME }}
          has-failed-tests: ${{ steps.tests.outcome == 'failure' }}
          upload-heap-dump: ${{ env.SECRETS_PRESENT == '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Upload test results to Datadog
        uses: ./.github/actions/upload-test-results-datadog
        if: always()
        with:
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
      - name: Should notify on failure
        if: always() && steps.tests.outcome == 'failure'
        run: |
          # GITHUB_HEAD_REF is only populated for pull requests runs, for scheduled runs extract the name from GITHUB_REF
          branch_name="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "branch=$branch_name" >> "${GITHUB_OUTPUT}"
          if [[ $branch_name == "master" || $branch_name =~ ^release-.*-e$ ]]; then
            echo "result=true" >> "${GITHUB_OUTPUT}"
          else
            echo "result=false" >> "${GITHUB_OUTPUT}"
          fi
        id: should_notify
      - name: Slack notify failed tests to Connectors team
        if: always() && steps.tests.outcome == 'failure' && steps.should_notify.outputs.result == 'true'
        uses: archive/github-actions-slack@433fef9978d3adae73168bfc9c5a7ce722780231 # v3.1.0
        with:
          slack-bot-user-oauth-access-token: ${{ secrets.SLACK_TOKEN }}
          slack-channel: C09HT9ETS73 # galaxy-data-management-notify channel ID
          slack-text: |
            :boom: Synapse ${{ matrix.synapse-test }} tests failed on branch: ${{ steps.should_notify.outputs.branch }} (<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|see CI job for details>) (:thumbsup: this message if you will take care of this)
      - name: Launch Flake Tracker
        if: failure() && steps.tests.outcome == 'failure' && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: starburstdata/ai-flake-fixer/.github/actions/launch-ai-flake@main
        with:
          github-access-token: ${{ secrets.GITHUBACCESSTOKEN }}
      - name: Cancel merge queue workflow
        if: ${{ failure() && github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"
  # --------------------------------------------------------------
  # After synapse tests finish, tear down SQL pool
  # --------------------------------------------------------------
  synapse-stop-pool:
    name: synapse-stop-pool
    permissions:
      id-token: write
      contents: read
    runs-on: [ self-hosted, gha-fleet-ec2-2cpu-1gb-arm64, latest ]
    needs: [ synapse-prepare, synapse-tests ]
    # Ignore status of tests, but only stop the pool if there's (potentially) one to stop.
    # We don't check if synapse-prepare succeeded in case it was canceled while starting the pool
    if: always() && needs.synapse-prepare.outputs.sql-pool-name != ''
    steps:
      - uses: actions/checkout@v6
      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.SYNAPSE_CLIENT_ID }}
          tenant-id: ${{ secrets.SYNAPSE_TENANT_ID }}
          subscription-id: ${{ secrets.SYNAPSE_SUBSCRIPTION_ID }}
      - name: Stop Pool
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        env:
          SYNAPSE_SQL_POOL: ${{ needs.synapse-prepare.outputs.sql-pool-name }}
          SYNAPSE_RESOURCE_GROUP: ${{ vars.SYNAPSE_RESOURCE_GROUP }}
          SYNAPSE_WORKSPACE: ${{ vars.SYNAPSE_WORKSPACE }}
        with:
          inlineScript: "$GITHUB_WORKSPACE/.github/bin/synapse/stop-sql-pool.sh"
      - name: Cancel merge queue workflow
        if: ${{ failure() && github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"
  # --------------------------------------------------------------
  # Weekly run all snowflake tests, labeled PRs to limit CI costs
  # --------------------------------------------------------------
  snowflake-weekly-tests:
    name: snowflake-weekly-tests
    runs-on: [ self-hosted, gha-fleet-ec2-4cpu-16gb-amd64, latest ]
    strategy:
      fail-fast: false
      matrix:
        modules: [ plugin/starburst-snowflake ]
        profile: [ default, smoke-tests, jdbc-integration-tests, parallel-integration-tests, fte-tests ]
        cloud: [ amazon-web-service, azure ]
        # Additional job filtering to include Azure only for 'default' and 'smoke-tests' profile
        exclude:
          - profile: jdbc-integration-tests
            cloud: azure
          - profile: parallel-integration-tests
            cloud: azure
          - profile: fte-tests
            cloud: azure

    timeout-minutes: 90
    if: "(github.event_name == 'schedule' && github.event.schedule == '0 0 * * 6') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'snowflake'))"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # checkout all commits, as the build result depends on `git describe` equivalent
      - name: Set up AWS code-artifacts login
        uses: ./.github/actions/starburst-setup
        with:
          aws-access-key-id: ${{ vars.ENG_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ENG_AWS_SECRET_ACCESS_KEY }}
          secret-id: ${{ vars.SEP_SECRETS_AWS_ID }}
      - uses: ./.github/actions/setup
      - name: Maven install
        run: |
          export MAVEN_OPTS="${MAVEN_INSTALL_OPTS}"
          $MAVEN clean install ${MAVEN_FAST_INSTALL} -am -pl ${{ matrix.modules }}
      - name: Run Snowflake AWS weekly tests
        id: tests-weekly-snowflake-aws
        if: >-
          contains(matrix.modules, 'starburst-snowflake') &&
          contains(matrix.cloud, 'amazon-web-service') &&
          (env.SNOWFLAKE_ACCOUNT_NAME != '' || env.SNOWFLAKE_PASSWORD != '' || env.SNOWFLAKE_PRIVATE_KEY != '')
        env:
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
          SNOWFLAKE_ACCOUNT_NAME: ${{ vars.SNOWFLAKE_ACCOUNT_NAME }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_2: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_2 }}
          SNOWFLAKE_PRIVATE_KEY_2_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_2_PASSPHRASE }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_CONNECTION_PARAMS: ${{ vars.SNOWFLAKE_CONNECTION_PARAMETERS }}
        run: |
          export MAVEN_OPTS="${MAVEN_INSTALL_OPTS}"
          $MAVEN test ${MAVEN_TEST} -pl ${{ matrix.modules }} ${{ matrix.profile != '' && format('-P {0}', matrix.profile) || '' }} \
          -Dsnowflake.test.server.url=jdbc:snowflake://"${SNOWFLAKE_ACCOUNT_NAME}".snowflakecomputing.com/?${SNOWFLAKE_CONNECTION_PARAMS} \
          -Dsnowflake.test.server.user="${SNOWFLAKE_USER}" \
          -Dsnowflake.test.server.password="${SNOWFLAKE_PASSWORD}" \
          -Dsnowflake.test.server.private-key="${SNOWFLAKE_PRIVATE_KEY}" \
          -Dsnowflake.test.server.private-key-2="${SNOWFLAKE_PRIVATE_KEY_2}" \
          -Dsnowflake.test.server.private-key-2-passphrase="${SNOWFLAKE_PRIVATE_KEY_2_PASSPHRASE}" \
          -Dsnowflake.test.server.role="${SNOWFLAKE_ROLE}" \
          -Dsnowflake.test.warehouse=TRINO_PLUGINS_TEST_WH \
      - name: Run Snowflake Azure weekly tests
        id: tests-weekly-snowflake-azure
        if: >-
          contains(matrix.modules, 'starburst-snowflake') &&
          contains(matrix.cloud, 'azure') &&
          (env.SNOWFLAKE_AZURE_ACCOUNT_NAME != '' || env.SNOWFLAKE_AZURE_PASSWORD != '' || env.SNOWFLAKE_AZURE_PRIVATE_KEY != '' || env.SNOWFLAKE_AZURE_REGION != '')
        env:
          SNOWFLAKE_AZURE_ACCOUNT_NAME: ${{ vars.SNOWFLAKE_AZURE_ACCOUNT_NAME }}
          SNOWFLAKE_AZURE_PASSWORD: ${{ secrets.SNOWFLAKE_AZURE_PASSWORD }}
          SNOWFLAKE_AZURE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_AZURE_PRIVATE_KEY }}
          SNOWFLAKE_AZURE_PRIVATE_KEY_2: ${{ secrets.SNOWFLAKE_AZURE_PRIVATE_KEY_2 }}
          SNOWFLAKE_AZURE_PRIVATE_KEY_2_PASSPHRASE: ${{ secrets.SNOWFLAKE_AZURE_PRIVATE_KEY_2_PASSPHRASE }}
          SNOWFLAKE_AZURE_REGION: ${{ vars.SNOWFLAKE_AZURE_REGION }}
          SNOWFLAKE_CONNECTION_PARAMS: ${{ vars.SNOWFLAKE_CONNECTION_PARAMETERS }}
        run: |
          export MAVEN_OPTS="${MAVEN_INSTALL_OPTS}"
          $MAVEN test ${MAVEN_TEST} -pl ${{ matrix.modules }} ${{ matrix.profile != '' && format('-P {0}', matrix.profile) || '' }} \
          -Dsnowflake.test.server.url=jdbc:snowflake://"${SNOWFLAKE_AZURE_ACCOUNT_NAME}"."${SNOWFLAKE_AZURE_REGION}".azure.snowflakecomputing.com/?${SNOWFLAKE_CONNECTION_PARAMS} \
          -Dsnowflake.test.server.user=test_user \
          -Dsnowflake.test.server.password="${SNOWFLAKE_AZURE_PASSWORD}" \
          -Dsnowflake.test.server.private-key="${SNOWFLAKE_AZURE_PRIVATE_KEY}" \
          -Dsnowflake.test.server.private-key-2="${SNOWFLAKE_AZURE_PRIVATE_KEY_2}" \
          -Dsnowflake.test.server.private-key-2-passphrase="${SNOWFLAKE_AZURE_PRIVATE_KEY_2_PASSPHRASE}" \
          -Dsnowflake.test.server.role=test_role \
          -Dsnowflake.test.warehouse=TRINO_PLUGINS_TEST_WH \
      - name: Sanitize artifact name
        if: always()
        run: |
          # Generate a valid artifact name and make it available to next steps as
          # an environment variable ARTIFACT_NAME
          # ", :, <, >, |, *, ?, \, / are not allowed in artifact names, replace it with an underscore
          name=$(echo -n "${{ matrix.modules }}" | sed -e 's/[":<>|\*\?\\\/]/_/g')
          echo "ARTIFACT_NAME=$name" >> $GITHUB_ENV
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: results ${{ env.ARTIFACT_NAME }}
          path: |
            **/target/surefire-reports
            **/target/checkstyle-*
            **/*.hprof
          retention-days: 30
      - name: Annotate with test report
        uses: trinodb/github-actions/action-surefire-report@b63800bedfbc7ab1ff2e5fe7eaecf5ab82ce6a70
        if: failure()
        with:
          # this workflow should never fail, as it is not a quality gateway
          fail_if_no_tests: false
          skip_publishing: true
      - name: Should notify on failure
        if: always() && (steps.tests-weekly-snowflake-aws.outcome == 'failure' || steps.tests-weekly-snowflake-azure.outcome == 'failure')
        run: |
          # GITHUB_HEAD_REF is only populated for pull requests runs, for scheduled runs extract the name from GITHUB_REF
          branch_name="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "branch=$branch_name" >> "${GITHUB_OUTPUT}"
          if [[ $branch_name == "master" || $branch_name =~ ^release-.*-e$ ]]; then
            echo "result=true" >> "${GITHUB_OUTPUT}"
          else
            echo "result=false" >> "${GITHUB_OUTPUT}"
          fi
        id: should_notify
      - name: Slack notify failed tests to Connectors team
        if: always() && (steps.tests-weekly-snowflake-aws.outcome == 'failure' || steps.tests-weekly-snowflake-azure.outcome == 'failure') && steps.should_notify.outputs.result == 'true'
        uses: archive/github-actions-slack@433fef9978d3adae73168bfc9c5a7ce722780231 # v3.1.0
        with:
          slack-bot-user-oauth-access-token: ${{ secrets.SLACK_TOKEN }}
          slack-channel: C09HT9ETS73 # galaxy-data-management-notify channel ID
          slack-text: |
            :boom: Snowflake weekly tests failed on branch: ${{ steps.should_notify.outputs.branch }} (<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|see CI job for details>) (:thumbsup: this message if you take care of this)
      - name: Launch Flake Tracker
        if: failure() && (steps.tests-weekly-snowflake-aws.outcome == 'failure' || steps.tests-weekly-snowflake-azure.outcome == 'failure') && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: starburstdata/ai-flake-fixer/.github/actions/launch-ai-flake@main
        with:
          github-access-token: ${{ secrets.GITHUBACCESSTOKEN }}
      - name: Cancel merge queue workflow
        if: ${{ failure() && github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"
  # --------------------------------------------------------------------------------------
  # Only run smoke-test profile snowflake tests nightly, labeled PRs to limit CI costs.
  # The release-* branches are excluded
  # --------------------------------------------------------------------------------------
  snowflake-nightly-tests:
    name: snowflake-nightly-tests
    runs-on: [ self-hosted, gha-fleet-ec2-4cpu-16gb-amd64, latest ]
    strategy:
      fail-fast: false
      matrix:
        modules: [ plugin/starburst-snowflake ]
        profile: [ smoke-tests ]
        cloud: [ amazon-web-service ]
    timeout-minutes: 30
    if: "(github.event_name == 'schedule' && github.event.schedule == '0 0 * * *' && !startsWith(github.ref, 'refs/heads/release-')) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'snowflake'))"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # checkout all commits, as the build result depends on `git describe` equivalent
      - name: Set up AWS code-artifacts login
        uses: ./.github/actions/starburst-setup
        with:
          aws-access-key-id: ${{ vars.ENG_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ENG_AWS_SECRET_ACCESS_KEY }}
          secret-id: ${{ vars.SEP_SECRETS_AWS_ID }}
      - uses: ./.github/actions/setup
      - name: Maven install
        run: |
          export MAVEN_OPTS="${MAVEN_INSTALL_OPTS}"
          $MAVEN clean install ${MAVEN_FAST_INSTALL} -am -pl ${{ matrix.modules }}
      - name: Run Snowflake AWS nightly tests
        id: tests-nightly-snowflake-aws
        if: >-
          contains(matrix.modules, 'starburst-snowflake') &&
          contains(matrix.cloud, 'amazon-web-service') &&
          (env.SNOWFLAKE_ACCOUNT_NAME != '' || env.SNOWFLAKE_PASSWORD != '' || env.SNOWFLAKE_PRIVATE_KEY != '')
        env:
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
          SNOWFLAKE_ACCOUNT_NAME: ${{ vars.SNOWFLAKE_ACCOUNT_NAME }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_2: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_2 }}
          SNOWFLAKE_PRIVATE_KEY_2_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_2_PASSPHRASE }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_CONNECTION_PARAMS: ${{ vars.SNOWFLAKE_CONNECTION_PARAMETERS }}
        run: |
          export MAVEN_OPTS="${MAVEN_INSTALL_OPTS}"
          $MAVEN test ${MAVEN_TEST} -pl ${{ matrix.modules }} ${{ matrix.profile != '' && format('-P {0}', matrix.profile) || '' }} \
          -Dsnowflake.test.server.url=jdbc:snowflake://"${SNOWFLAKE_ACCOUNT_NAME}".snowflakecomputing.com/?${SNOWFLAKE_CONNECTION_PARAMS} \
          -Dsnowflake.test.server.user="${SNOWFLAKE_USER}" \
          -Dsnowflake.test.server.password="${SNOWFLAKE_PASSWORD}" \
          -Dsnowflake.test.server.private-key="${SNOWFLAKE_PRIVATE_KEY}" \
          -Dsnowflake.test.server.private-key-2="${SNOWFLAKE_PRIVATE_KEY_2}" \
          -Dsnowflake.test.server.private-key-2-passphrase="${SNOWFLAKE_PRIVATE_KEY_2_PASSPHRASE}" \
          -Dsnowflake.test.server.role="${SNOWFLAKE_ROLE}" \
          -Dsnowflake.test.warehouse=TRINO_PLUGINS_TEST_WH \
      - name: Sanitize artifact name
        if: always()
        run: |
          # Generate a valid artifact name and make it available to next steps as
          # an environment variable ARTIFACT_NAME
          # ", :, <, >, |, *, ?, \, / are not allowed in artifact names, replace it with an underscore
          name=$(echo -n "${{ matrix.modules }}" | sed -e 's/[":<>|\*\?\\\/]/_/g')
          echo "ARTIFACT_NAME=$name" >> $GITHUB_ENV
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: results ${{ env.ARTIFACT_NAME }}
          path: |
            **/target/surefire-reports
            **/target/checkstyle-*
            **/*.hprof
          retention-days: 30
      - name: Annotate with test report
        uses: trinodb/github-actions/action-surefire-report@b63800bedfbc7ab1ff2e5fe7eaecf5ab82ce6a70
        if: failure()
        with:
          # this workflow should never fail, as it is not a quality gateway
          fail_if_no_tests: false
          skip_publishing: true
      - name: Should notify on failure
        if: always() && steps.tests-nightly-snowflake-aws.outcome == 'failure'
        run: |
          # GITHUB_HEAD_REF is only populated for pull requests runs, for scheduled runs extract the name from GITHUB_REF
          branch_name="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "branch=$branch_name" >> "${GITHUB_OUTPUT}"
          if [[ $branch_name == "master" || $branch_name =~ ^release-.*-e$ ]]; then
            echo "result=true" >> "${GITHUB_OUTPUT}"
          else
            echo "result=false" >> "${GITHUB_OUTPUT}"
          fi
        id: should_notify
      - name: Slack notify failed tests to Connectors team
        if: always() && steps.tests-nightly-snowflake-aws.outcome && steps.should_notify.outputs.result == 'true'
        uses: archive/github-actions-slack@433fef9978d3adae73168bfc9c5a7ce722780231 # v3.1.0
        with:
          slack-bot-user-oauth-access-token: ${{ secrets.SLACK_TOKEN }}
          slack-channel: C09HT9ETS73 # galaxy-data-management-notify channel ID
          slack-text: |
            :boom: Snowflake nightly tests failed on branch: ${{ steps.should_notify.outputs.branch }} (<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|see CI job for details>) (:thumbsup: this message if you take care of this)
      - name: Launch Flake Tracker
        if: failure() && steps.tests-nightly-snowflake-aws.outcome == 'failure' && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: starburstdata/ai-flake-fixer/.github/actions/launch-ai-flake@main
        with:
          github-access-token: ${{ secrets.GITHUBACCESSTOKEN }}
      - name: Cancel merge queue workflow
        if: ${{ failure() && github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"

