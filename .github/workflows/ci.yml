            - { modules: testing/trino-faulttolerant-tests, profile: test-fault-tolerant-hive }
            - { modules: testing/trino-faulttolerant-tests, profile: test-fault-tolerant-iceberg }
            - { modules: testing/trino-tests, runners: [ self-hosted, gha-fleet-ec2-16cpu-64gb-amd64, latest ], buildAll: true } # buildAll is needed to build and package plugins required by TestConnectorSensitiveProperties
          EOF
          ./.github/bin/build-matrix-from-impacted.py -v -i gib-impacted.log -m .github/test-matrix.yaml -o matrix.json
          echo "Matrix: $(jq '.' matrix.json)"
          echo "matrix=$(jq -c '.' matrix.json)" >> $GITHUB_OUTPUT
      - name: Cancel merge queue workflow
        if: ${{ failure() && github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"

  test:
    runs-on: ${{ matrix.runners != null && matrix.runners || fromJSON('["self-hosted", "gha-fleet-ec2-4cpu-16gb-amd64", "latest" ]') }}
    needs: build-test-matrix
    if: needs.build-test-matrix.outputs.matrix != '{}'
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix: ${{ fromJson(needs.build-test-matrix.outputs.matrix) }}
    timeout-minutes: 90
    env:
      REPORT_TEST_SESSION_NAME: test-matrix
      REPORT_SERVICE_NAME: ${{ matrix.modules }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # checkout all commits to be able to determine merge base for GIB
          ref: |
            ${{ github.event_name == 'repository_dispatch' &&
                github.event.client_payload.pull_request.head.sha == github.event.client_payload.slash_command.args.named.sha &&
                format('refs/pull/{0}/head', github.event.client_payload.pull_request.number) || '' }}
      - name: Set up AWS code-artifacts and ECR login
        uses: ./.github/actions/starburst-setup
        with:
          aws-access-key-id: ${{ vars.ENG_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ENG_AWS_SECRET_ACCESS_KEY }}
          secret-id: ${{ vars.SEP_SECRETS_AWS_ID }}
          login-docker: true
      - uses: ./.github/actions/setup
        timeout-minutes: 15
        with:
          cache: restore
          cleanup-node: ${{ format('{0}', matrix.modules == 'plugin/trino-singlestore' || matrix.modules == 'plugin/trino-exasol' || matrix.modules == 'plugin/trino-oracle' || matrix.modules == 'plugin/trino-iceberg' || matrix.modules == 'plugin/trino-lakehouse') }}
          java-version: ${{ matrix.jdk != '' && matrix.jdk || '25.0.2' }}
      - name: Maven Install
        run: |
          export MAVEN_OPTS="${MAVEN_INSTALL_OPTS}"
          if [ ${{ matrix.buildAll }} == 'true' ]; then
            $MAVEN clean install ${MAVEN_FAST_INSTALL}
          else
            $MAVEN clean install ${MAVEN_FAST_INSTALL} ${MAVEN_GIB} -am -pl "${{ matrix.modules }}"
          fi
      - name: Maven Tests
        id: tests
        if: >-
          matrix.modules != 'plugin/starburst-functions'
          && matrix.modules != 'lib/starburst-functions-client'
          && ! (contains(matrix.modules, 'starburst-objectstore') && contains(matrix.profile, 'cloud-tests'))
          && ! (contains(matrix.modules, 'trino-mongodb') && contains(matrix.profile, 'cloud-tests'))
          && ! (contains(matrix.modules, 'trino-bigquery') && contains(matrix.profile, 'cloud-tests-2'))
          && ! (contains(matrix.modules, 'trino-delta-lake') && contains(matrix.profile, 'cloud-tests'))
          && ! (contains(matrix.modules, 'trino-google-sheets') && contains(matrix.profile, 'cloud-tests'))
          && ! (contains(matrix.modules, 'trino-iceberg') && contains(matrix.profile, 'cloud-tests'))
          && ! (contains(matrix.modules, 'trino-snowflake') && contains(matrix.profile, 'cloud-tests'))
          && ! (contains(matrix.modules, 'trino-exchange-filesystem') && contains(matrix.profile, 'cloud-tests'))
          && ! (contains(matrix.modules, 'trino-filesystem-azure') && contains(matrix.profile, 'cloud-tests'))
          && ! (contains(matrix.modules, 'trino-filesystem-gcs') && contains(matrix.profile, 'cloud-tests'))
          && ! (contains(matrix.modules, 'trino-filesystem-s3') && contains(matrix.profile, 'cloud-tests'))
          && ! (contains(matrix.modules, 'starburst-buffer-data-server') && contains(matrix.profile, 'cloud-tests'))
        run: $MAVEN test ${MAVEN_TEST} -pl ${{ matrix.modules }} ${{ matrix.profile != '' && format('-P {0}', matrix.profile) || '' }}
      # Additional tests for selected modules
      - name: Run Starburst Functions tests
        id: tests-starburst-functions
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.TRINO_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRINO_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          S3_BUCKET: ${{ vars.TRINO_S3_BUCKET }}
          GCP_STORAGE_BUCKET: ${{ vars.GCP_STORAGE_BUCKET }}
          GCP_CREDENTIALS_KEY: ${{ secrets.GCP_CREDENTIALS_KEY }}
          ABFS_CONTAINER: ${{ vars.AZURE_ABFS_HIERARCHICAL_CONTAINER }}
          ABFS_ACCOUNT: ${{ vars.AZURE_ABFS_HIERARCHICAL_ACCOUNT }}
          ABFS_ACCESS_KEY: ${{ secrets.AZURE_ABFS_HIERARCHICAL_ACCESS_KEY }}
        if: matrix.modules == 'plugin/starburst-functions' || matrix.modules == 'lib/starburst-functions-client'
        run: |
          missing_vars=()
          for var in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION S3_BUCKET GCP_STORAGE_BUCKET GCP_CREDENTIALS_KEY ABFS_CONTAINER ABFS_ACCOUNT ABFS_ACCESS_KEY; do
            if [[ -z "${!var}" ]]; then
              missing_vars+=("$var")
            fi
          done
          if [[ ${#missing_vars[@]} -gt 0 ]]; then
            echo "Error: Required environment variables are missing: ${missing_vars[*]}"
            exit 1
          fi
          export MAVEN_OPTS="${MAVEN_INSTALL_OPTS}"
          $MAVEN test ${MAVEN_TEST} -pl ${{ matrix.modules }} ${{ matrix.profile != '' && format('-P {0}', matrix.profile) || '' }}
      - name: HDFS file system cache isolated JVM tests
        id: tests-hdfs-isolated
        if: contains(matrix.modules, 'trino-hdfs')
        run: |
          $MAVEN test ${MAVEN_TEST} -pl :trino-hdfs -P test-isolated-jvm-suites
      - name: FileSystem Exchange Storage Cloud Tests
        id: tests-filesystem-exchange
        env:
          ABFS_FLAT_ACCOUNT: ${{ vars.AZURE_ABFS_FLAT_ACCOUNT }}
          ABFS_FLAT_ACCESS_KEY: ${{ secrets.AZURE_ABFS_FLAT_ACCESS_KEY }}
          ABFS_HIERARCHICAL_ACCOUNT: ${{ vars.AZURE_ABFS_HIERARCHICAL_ACCOUNT }}
          ABFS_HIERARCHICAL_ACCESS_KEY: ${{ secrets.AZURE_ABFS_HIERARCHICAL_ACCESS_KEY }}
        if: >-
          contains(matrix.modules, 'trino-exchange-filesystem') && contains(matrix.profile, 'cloud-tests') &&
          (env.CI_SKIP_SECRETS_PRESENCE_CHECKS != '' || env.ABFS_FLAT_ACCESS_KEY != '' || env.ABFS_HIERARCHICAL_ACCESS_KEY != '')
        run: |
          $MAVEN test ${MAVEN_TEST} -pl ${{ matrix.modules }} ${{ format('-P {0}', matrix.profile) }}
      - name: S3 FileSystem Cloud Tests
        id: tests-s3
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.TRINO_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRINO_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.TRINO_AWS_REGION }}
        if: >-
          contains(matrix.modules, 'trino-filesystem-s3') && contains(matrix.profile, 'cloud-tests') &&
          (env.CI_SKIP_SECRETS_PRESENCE_CHECKS != '' || env.AWS_ACCESS_KEY_ID != '' || env.AWS_SECRET_ACCESS_KEY != '')
        run: |
          # Create an empty S3 bucket and multi-region access point for S3 filesystem cloud tests and add the resource names to GitHub environment variables
          .github/bin/s3/setup-empty-s3-bucket.sh
          EMPTY_S3_BUCKET=$(cat .github/bin/s3/.bucket-identifier)
          export EMPTY_S3_BUCKET
          .github/bin/s3/setup-empty-s3-mrap.sh
          AWS_MRAP_ARN=$(cat .github/bin/s3/.mrap-arn)
          export AWS_MRAP_ARN
          $MAVEN test ${MAVEN_TEST} -pl ${{ matrix.modules }} ${{ format('-P {0}', matrix.profile) }}
      - name: Cleanup ephemeral S3 resources
        env:
          AWS_REGION: ${{ vars.TRINO_AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ vars.TRINO_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRINO_AWS_SECRET_ACCESS_KEY }}
        # Cancelled workflows may not have cleaned up the ephemeral resources
        if: always()
        run: |
          .github/bin/s3/delete-s3-mrap.sh || true
          .github/bin/s3/delete-s3-bucket.sh || true
      - name: Cloud Object Store Tests
        id: tests-objectstore
        # Cloud tests are separate because they are time intensive, requiring cross-cloud network communication
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TRINO_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRINO_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.TRINO_AWS_REGION }}
          DATABRICKS_UNITY_JDBC_URL: ${{ vars.DATABRICKS_UNITY_JDBC_URL }}
          DATABRICKS_UNITY_CATALOG_NAME: ${{ vars.DATABRICKS_UNITY_CATALOG_NAME }}
          DATABRICKS_UNITY_EXTERNAL_LOCATION: ${{ vars.DATABRICKS_UNITY_EXTERNAL_LOCATION }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_LOGIN: token
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_AWS_ACCESS_KEY_ID: ${{ vars.GALAXY_TRINO_DATABRICKS_AWS_ACCESS_KEY_ID }}
          DATABRICKS_AWS_SECRET_ACCESS_KEY: ${{ secrets.GALAXY_TRINO_DATABRICKS_AWS_SECRET_ACCESS_KEY }}
          DATABRICKS_AWS_REGION: us-east-1
        if: >-
          contains(matrix.modules, 'starburst-objectstore') && contains(matrix.profile, 'cloud-tests') &&
          (env.CI_SKIP_SECRETS_PRESENCE_CHECKS != '' || env.AWS_ACCESS_KEY_ID != '' || env.AWS_SECRET_ACCESS_KEY != '' || env.S3_BUCKET != '')
        run: |
          $MAVEN test ${MAVEN_TEST} ${{ format('-P {0}', matrix.profile) }} -pl :starburst-objectstore \
          -Ds3.bucket="galaxy-trino-ci-useast1"
      - name: Azure FileSystem Cloud Tests
        id: tests-azure
        env:
          ABFS_FLAT_ACCOUNT: ${{ vars.AZURE_ABFS_FLAT_ACCOUNT }}
          ABFS_FLAT_ACCESS_KEY: ${{ secrets.AZURE_ABFS_FLAT_ACCESS_KEY }}
          ABFS_HIERARCHICAL_ACCOUNT: ${{ vars.AZURE_ABFS_HIERARCHICAL_ACCOUNT }}
          ABFS_HIERARCHICAL_ACCESS_KEY: ${{ secrets.AZURE_ABFS_HIERARCHICAL_ACCESS_KEY }}
          ABFS_OAUTH_TENANT_ID: ${{ vars.AZURE_ABFS_OAUTH_TENANT_ID }}
          ABFS_OAUTH_CLIENT_ID: ${{ vars.AZURE_ABFS_OAUTH_CLIENT_ID }}
          ABFS_OAUTH_CLIENT_SECRET: ${{ secrets.AZURE_ABFS_OAUTH_CLIENT_SECRET }}
        # Run tests if any of the secrets are present
        if: >-
          contains(matrix.modules, 'trino-filesystem-azure') && contains(matrix.profile, 'cloud-tests') &&
          (env.CI_SKIP_SECRETS_PRESENCE_CHECKS != '' || env.ABFS_FLAT_ACCESS_KEY != '' || env.ABFS_HIERARCHICAL_ACCESS_KEY != '' || env.ABFS_OAUTH_CLIENT_SECRET != '')
        run: |
          $MAVEN test ${MAVEN_TEST} -pl ${{ matrix.modules }} ${{ format('-P {0}', matrix.profile) }}
      - name: GCS FileSystem Cloud Tests
        id: tests-gcs
        env:
          GCP_CREDENTIALS_KEY: ${{ secrets.GCP_CREDENTIALS_KEY }}
        if: >-
          contains(matrix.modules, 'trino-filesystem-gcs') && contains(matrix.profile, 'cloud-tests') &&
          (env.CI_SKIP_SECRETS_PRESENCE_CHECKS != '' || env.GCP_CREDENTIALS_KEY != '')
        run: |
          $MAVEN test ${MAVEN_TEST} -pl ${{ matrix.modules }} ${{ format('-P {0}', matrix.profile) }}
      - name: Buffer Service TrinoFs Spooling Cloud Tests
        id: tests-buffer-trino-fs-cloud
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.TRINO_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRINO_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.TRINO_AWS_REGION }}
          S3_BUCKET: ${{ vars.TRINO_S3_BUCKET }}
          ABFS_FLAT_ACCOUNT: ${{ vars.AZURE_ABFS_FLAT_ACCOUNT }}
          ABFS_FLAT_ACCESS_KEY: ${{ secrets.AZURE_ABFS_FLAT_ACCESS_KEY }}
          ABFS_HIERARCHICAL_ACCOUNT: ${{ vars.AZURE_ABFS_HIERARCHICAL_ACCOUNT }}
          ABFS_HIERARCHICAL_ACCESS_KEY: ${{ secrets.AZURE_ABFS_HIERARCHICAL_ACCESS_KEY }}
          ABFS_OAUTH_TENANT_ID: ${{ vars.AZURE_ABFS_OAUTH_TENANT_ID }}
          ABFS_OAUTH_CLIENT_ID: ${{ vars.AZURE_ABFS_OAUTH_CLIENT_ID }}
          ABFS_OAUTH_CLIENT_SECRET: ${{ secrets.AZURE_ABFS_OAUTH_CLIENT_SECRET }}
          GCP_CREDENTIALS_KEY: ${{ secrets.GCP_CREDENTIALS_KEY }}
          GCP_STORAGE_BUCKET: ${{ vars.GCP_STORAGE_BUCKET }}
        if: >-
          contains(matrix.modules, 'starburst-buffer-data-server') && contains(matrix.profile, 'cloud-tests') &&
          (env.CI_SKIP_SECRETS_PRESENCE_CHECKS != '' || env.AWS_ACCESS_KEY_ID != '' || env.ABFS_FLAT_ACCESS_KEY != '' || env.ABFS_HIERARCHICAL_ACCESS_KEY != '' || env.ABFS_OAUTH_CLIENT_SECRET != '' || env.GCP_CREDENTIALS_KEY != '')
        run: |
          $MAVEN test ${MAVEN_TEST} -pl ${{ matrix.modules }} ${{ format('-P {0}', matrix.profile) }}
      - name: Cloud Delta Lake Tests
        id: tests-delta
      # Cloud tests are separate because they are time intensive, requiring cross-cloud network communication
        env:
          ABFS_CONTAINER: ${{ vars.AZURE_ABFS_HIERARCHICAL_CONTAINER }}
          ABFS_ACCOUNT: ${{ vars.AZURE_ABFS_HIERARCHICAL_ACCOUNT }}
          ABFS_ACCESSKEY: ${{ secrets.AZURE_ABFS_HIERARCHICAL_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ vars.TRINO_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRINO_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.TRINO_AWS_REGION }}
          S3_BUCKET: ${{ vars.TRINO_S3_BUCKET }}
          GCP_CREDENTIALS_KEY: ${{ secrets.GCP_CREDENTIALS_KEY }}
          GCP_STORAGE_BUCKET: ${{ vars.GCP_STORAGE_BUCKET }}
          GCS_DATABRICKS_UNITY_JDBC_URL: ${{ vars.GCS_DATABRICKS_UNITY_JDBC_URL }}
          GCS_DATABRICKS_UNITY_CATALOG_NAME: ${{ vars.GCS_DATABRICKS_UNITY_CATALOG_NAME }}
          GCS_DATABRICKS_UNITY_EXTERNAL_LOCATION: ${{ vars.GCS_DATABRICKS_UNITY_EXTERNAL_LOCATION }}
          GCS_DATABRICKS_HOST: ${{ vars.GCS_DATABRICKS_HOST }}
          GCS_DATABRICKS_LOGIN: token
          GCS_DATABRICKS_TOKEN: ${{ secrets.GCS_DATABRICKS_TOKEN }}
          DATABRICKS_UNITY_GCP_GCS_JSON_KEY: ${{ secrets.DATABRICKS_UNITY_GCP_GCS_JSON_KEY }}
          DATABRICKS_UNITY_JDBC_URL: ${{ vars.DATABRICKS_UNITY_JDBC_URL }}
          DATABRICKS_UNITY_CATALOG_NAME: ${{ vars.DATABRICKS_UNITY_CATALOG_NAME }}
          DATABRICKS_UNITY_EXTERNAL_LOCATION: ${{ vars.DATABRICKS_UNITY_EXTERNAL_LOCATION }}
          AZURE_DATABRICKS_UNITY_JDBC_URL: ${{ vars.AZURE_DATABRICKS_UNITY_JDBC_URL }}
          AZURE_DATABRICKS_UNITY_CATALOG_NAME: ${{ vars.AZURE_DATABRICKS_UNITY_CATALOG_NAME }}
          AZURE_DATABRICKS_UNITY_EXTERNAL_LOCATION: ${{ vars.AZURE_DATABRICKS_UNITY_EXTERNAL_LOCATION }}
          AZURE_DATABRICKS_HOST: ${{ vars.AZURE_DATABRICKS_HOST }}
          AZURE_DATABRICKS_LOGIN: token
          AZURE_DATABRICKS_TOKEN: ${{ secrets.AZURE_DATABRICKS_TOKEN }}
          DATABRICKS_AZURE_STORAGE_ACCESS_KEY: ${{ secrets.DATABRICKS_AZURE_STORAGE_ACCESS_KEY }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_LOGIN: token
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_AWS_ACCESS_KEY_ID: ${{ vars.GALAXY_TRINO_DATABRICKS_AWS_ACCESS_KEY_ID }}
          DATABRICKS_AWS_SECRET_ACCESS_KEY: ${{ secrets.GALAXY_TRINO_DATABRICKS_AWS_SECRET_ACCESS_KEY }}
          DATABRICKS_AWS_REGION: us-east-1
        # Run tests if any of the secrets is present. Do not skip tests when one secret renamed, or secret name has a typo.
        if: >-
          contains(matrix.modules, 'trino-delta-lake') && contains(matrix.profile, 'cloud-tests') &&
          (env.CI_SKIP_SECRETS_PRESENCE_CHECKS != '' || env.ABFS_ACCOUNT != '' || env.ABFS_CONTAINER != '' || env.ABFS_ACCESSKEY != '' || env.AWS_ACCESS_KEY_ID != '' || env.AWS_SECRET_ACCESS_KEY != '' || env.GCP_CREDENTIALS_KEY != '')
        run: |
          $MAVEN test ${MAVEN_TEST} ${{ format('-P {0}', matrix.profile) }} -pl :trino-delta-lake \
            -Dtesting.azure-abfs-container="${ABFS_CONTAINER}" \
            -Dtesting.azure-abfs-account="${ABFS_ACCOUNT}" \
            -Dtesting.azure-abfs-access-key="${ABFS_ACCESSKEY}" \
            -Dtesting.gcp-storage-bucket="${GCP_STORAGE_BUCKET}" \
            -Dtesting.gcp-credentials-key="${GCP_CREDENTIALS_KEY}"
      - name: Cloud MongoDB Tests
        id: tests-mongodb
        if: matrix.modules == 'plugin/trino-mongodb' && contains(matrix.profile, 'cloud-tests') && (env.CI_SKIP_SECRETS_PRESENCE_CHECKS != '' || env.MONGODB_ATLAS_CONNECTION_URL != '')
        env:
          MONGODB_CONFIG: >-
            -Dtest.mongodb.atlas.connection-url=${{ secrets.MONGODB_ATLAS_CONNECTION_URL }}
            -Dtest.mongodb.federated-database.connection-url=${{ secrets.MONGODB_FEDERATED_DATABASE_CONNECTION_URL }}
            -Dtest.mongodb.federated-datasource.connection-url=${{ secrets.MONGODB_FEDERATED_DATASOURCE_CONNECTION_URL }}
            -Dtest.mongodb.federated-datasource.cluster-name=${{ vars.MONGODB_FEDERATED_DATASOURCE_CLUSTER_NAME }}
            -Dtest.mongodb.federated-datasource.project-id=${{ vars.MONGODB_FEDERATED_DATASOURCE_PROJECT_ID }}
        run: |
          export MAVEN_OPTS="${MAVEN_INSTALL_OPTS}"
          $MAVEN test ${MAVEN_TEST} -pl :trino-mongodb -Pcloud-tests ${MONGODB_CONFIG}
      - name: Cloud BigQuery Tests
        id: tests-bq
        env:
          BIGQUERY_CREDENTIALS_KEY: ${{ secrets.BIGQUERY_CREDENTIALS_KEY }}
          BIGQUERY_CASE_INSENSITIVE_CREDENTIALS_KEY: ${{ secrets.BIGQUERY_CASE_INSENSITIVE_CREDENTIALS_KEY }}
          GCP_STORAGE_BUCKET: ${{ vars.GCP_STORAGE_BUCKET }}
          BIGQUERY_TESTING_BIGLAKE_CONNECTION_ID: ${{ vars.BIGQUERY_TESTING_BIGLAKE_CONNECTION_ID }}
          BIGQUERY_TESTING_PROJECT_ID: ${{ vars.BIGQUERY_TESTING_PROJECT_ID }}
          BIGQUERY_TESTING_PARENT_PROJECT_ID: ${{ vars.BIGQUERY_TESTING_PARENT_PROJECT_ID }}
        if: matrix.modules == 'plugin/trino-bigquery' && !contains(matrix.profile, 'cloud-tests-2') && (env.CI_SKIP_SECRETS_PRESENCE_CHECKS != '' || env.BIGQUERY_CREDENTIALS_KEY != '')
        run: |
          $MAVEN test ${MAVEN_TEST} -pl :trino-bigquery -Pcloud-tests-1 \
            -Dtesting.bigquery.credentials-key="${BIGQUERY_CREDENTIALS_KEY}" \
            -Dtesting.bigquery-case-insensitive.credentials-key="${BIGQUERY_CASE_INSENSITIVE_CREDENTIALS_KEY}" \
            -Dtesting.gcp-storage-bucket="${GCP_STORAGE_BUCKET}" \
            -Dtesting.bigquery-connection-id="${BIGQUERY_TESTING_BIGLAKE_CONNECTION_ID}" \
            -Dtesting.bigquery-project-id="${BIGQUERY_TESTING_PROJECT_ID}" \
            -Dtesting.bigquery-parent-project-id="${BIGQUERY_TESTING_PARENT_PROJECT_ID}"
      - name: Cloud BigQuery Smoke Tests
        id: tests-bq-smoke
        env:
          BIGQUERY_CREDENTIALS_KEY: ${{ secrets.BIGQUERY_CREDENTIALS_KEY }}
          GCP_STORAGE_BUCKET: ${{ vars.GCP_STORAGE_BUCKET }}
        if: matrix.modules == 'plugin/trino-bigquery' && contains(matrix.profile, 'cloud-tests-2') && (env.CI_SKIP_SECRETS_PRESENCE_CHECKS != '' || env.BIGQUERY_CREDENTIALS_KEY != '')
        run: |
          $MAVEN test ${MAVEN_TEST} -pl :trino-bigquery -Pcloud-tests-2 \
            -Dtesting.bigquery.credentials-key="${BIGQUERY_CREDENTIALS_KEY}" \
            -Dtesting.gcp-storage-bucket="${GCP_STORAGE_BUCKET}" \
            -Dtesting.alternate-bq-project-id=bigquery-cicd-alternate
      - name: Cloud Snowflake Tests
        id: tests-snowflake
        env:
          SNOWFLAKE_URL: ${{ vars.SNOWFLAKE_URL }}
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_2: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_2 }}
          SNOWFLAKE_PRIVATE_KEY_2_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_2_PASSPHRASE }}
          SNOWFLAKE_CONNECTION_PARAMS: ${{ vars.SNOWFLAKE_CONNECTION_PARAMETERS }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
        if: matrix.modules == 'plugin/trino-snowflake' && contains(matrix.profile, 'cloud-tests') && (env.CI_SKIP_SECRETS_PRESENCE_CHECKS != '' || env.SNOWFLAKE_URL != '')
        run: |
          $MAVEN test ${MAVEN_TEST} -pl :trino-snowflake -Pcloud-tests \
            -Dsnowflake.test.server.url="${SNOWFLAKE_URL}?${SNOWFLAKE_CONNECTION_PARAMS}" \
            -Dsnowflake.test.server.user="${SNOWFLAKE_USER}" \
            -Dsnowflake.test.server.password="${SNOWFLAKE_PASSWORD}" \
            -Dsnowflake.test.server.private-key="${SNOWFLAKE_PRIVATE_KEY}" \
            -Dsnowflake.test.server.private-key-2="${SNOWFLAKE_PRIVATE_KEY_2}" \
            -Dsnowflake.test.server.private-key-2-passphrase="${SNOWFLAKE_PRIVATE_KEY_2_PASSPHRASE}" \
            -Dsnowflake.test.server.database="${SNOWFLAKE_DATABASE}" \
            -Dsnowflake.test.server.role="${SNOWFLAKE_ROLE}" \
            -Dsnowflake.test.server.warehouse="${SNOWFLAKE_WAREHOUSE}"
      - name: Iceberg Cloud Tests
        id: tests-iceberg
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.TRINO_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRINO_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.TRINO_AWS_REGION }}
          S3_BUCKET: ${{ vars.TRINO_S3_BUCKET }}
          S3_TABLES_BUCKET: ${{ vars.S3_TABLES_BUCKET }}
          S3_TABLES_AWS_ACCESS_KEY_ID: ${{ vars.S3_TABLES_AWS_ACCESS_KEY_ID }}
          S3_TABLES_AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_TABLES_AWS_SECRET_ACCESS_KEY }}
          S3_TABLES_AWS_REGION: ${{ vars.S3_TABLES_AWS_REGION }}
          GCP_CREDENTIALS_KEY: ${{ secrets.GCP_CREDENTIALS_KEY }}
          GCP_STORAGE_BUCKET: ${{ vars.GCP_STORAGE_BUCKET }}
          ABFS_CONTAINER: ${{ vars.AZURE_ABFS_HIERARCHICAL_CONTAINER }}
          ABFS_ACCOUNT: ${{ vars.AZURE_ABFS_HIERARCHICAL_ACCOUNT }}
          ABFS_ACCESS_KEY: ${{ secrets.AZURE_ABFS_HIERARCHICAL_ACCESS_KEY }}
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_URL: ${{ vars.SNOWFLAKE_URL }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_CATALOG_SCHEMA: ${{ vars.SNOWFLAKE_CATALOG_SCHEMA }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_CATALOG_S3_ACCESS_KEY_ID: ${{ vars.SNOWFLAKE_CATALOG_S3_ACCESS_KEY_ID }}
          SNOWFLAKE_CATALOG_S3_SECRET_ACCESS_KEY: ${{ secrets.SNOWFLAKE_CATALOG_S3_SECRET_ACCESS_KEY }}
          SNOWFLAKE_EXTERNAL_VOLUME: ${{ vars.SNOWFLAKE_EXTERNAL_VOLUME }}
          SNOWFLAKE_CATALOG_S3_REGION: ${{ vars.SNOWFLAKE_CATALOG_S3_REGION }}
          DATABRICKS_UNITY_JDBC_URL: ${{ vars.DATABRICKS_UNITY_JDBC_URL }}
          DATABRICKS_UNITY_CATALOG_NAME: ${{ vars.DATABRICKS_UNITY_CATALOG_NAME }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_LOGIN: token
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_AWS_ACCESS_KEY_ID: ${{ vars.GALAXY_TRINO_DATABRICKS_AWS_ACCESS_KEY_ID }}
          DATABRICKS_AWS_SECRET_ACCESS_KEY: ${{ secrets.GALAXY_TRINO_DATABRICKS_AWS_SECRET_ACCESS_KEY }}
          DATABRICKS_AWS_REGION: us-east-1
        if: >-
          contains(matrix.modules, 'trino-iceberg') && contains(matrix.profile, 'cloud-tests') &&
          (env.CI_SKIP_SECRETS_PRESENCE_CHECKS != '' || env.AWS_ACCESS_KEY_ID != '' || env.AWS_SECRET_ACCESS_KEY != '' || env.GCP_CREDENTIALS_KEY != '')
        run: |
          $MAVEN test ${MAVEN_TEST} -pl :trino-iceberg ${{ format('-P {0}', matrix.profile) }} \
            -Dtesting.gcp-storage-bucket="${GCP_STORAGE_BUCKET}" \
            -Dtesting.gcp-credentials-key="${GCP_CREDENTIALS_KEY}" \
            -Dtesting.azure-abfs-container="${ABFS_CONTAINER}" \
            -Dtesting.azure-abfs-account="${ABFS_ACCOUNT}" \
            -Dtesting.azure-abfs-access-key="${ABFS_ACCESS_KEY}" \
            -Dtesting.snowflake.catalog.user="${SNOWFLAKE_USER}" \
            -Dtesting.snowflake.catalog.password="${SNOWFLAKE_PASSWORD}" \
            -Dtesting.snowflake.catalog.account-url="${SNOWFLAKE_URL}" \
            -Dtesting.snowflake.catalog.database="${SNOWFLAKE_DATABASE}" \
            -Dtesting.snowflake.catalog.schema="${SNOWFLAKE_CATALOG_SCHEMA}" \
            -Dtesting.snowflake.catalog.role="${SNOWFLAKE_ROLE}" \
            -Dtesting.snowflake.catalog.warehouse="${SNOWFLAKE_WAREHOUSE}" \
            -Dtesting.snowflake.catalog.s3.access-key="${SNOWFLAKE_CATALOG_S3_ACCESS_KEY_ID}" \
            -Dtesting.snowflake.catalog.s3.secret-key="${SNOWFLAKE_CATALOG_S3_SECRET_ACCESS_KEY}" \
            -Dtesting.snowflake.catalog.s3.external.volume="${SNOWFLAKE_EXTERNAL_VOLUME}" \
            -Dtesting.snowflake.catalog.s3.region="${SNOWFLAKE_CATALOG_S3_REGION}"
      - name: Cloud Google Sheets Tests
        id: tests-google-sheets
        env:
          SHEETS_CREDENTIALS_KEY: ${{ secrets.SHEETS_CREDENTIALS_KEY }}
        if: contains(matrix.modules, 'trino-google-sheets') && contains(matrix.profile, 'cloud-tests') && (env.CI_SKIP_SECRETS_PRESENCE_CHECKS != '' || env.SHEETS_CREDENTIALS_KEY != '')
        run: |
          $MAVEN test ${MAVEN_TEST} -pl :trino-google-sheets -Pcloud-tests \
            -Dtesting.gsheets.credentials-key="${SHEETS_CREDENTIALS_KEY}"
      - name: Cloud Redshift Tests ${{ matrix.profile }}
        id: tests-redshift
        env:
          AWS_REGION: ${{ vars.REDSHIFT_AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ vars.REDSHIFT_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.REDSHIFT_AWS_SECRET_ACCESS_KEY }}
          REDSHIFT_SUBNET_GROUP_NAME: ${{ vars.REDSHIFT_SUBNET_GROUP_NAME }}
          REDSHIFT_IAM_ROLES: ${{ vars.REDSHIFT_IAM_ROLES }}
          REDSHIFT_VPC_SECURITY_GROUP_IDS: ${{ vars.REDSHIFT_VPC_SECURITY_GROUP_IDS }}
          REDSHIFT_S3_TPCH_TABLES_ROOT: ${{ vars.REDSHIFT_S3_TPCH_TABLES_ROOT }}
          REDSHIFT_S3_UNLOAD_ROOT: ${{ vars.REDSHIFT_S3_UNLOAD_ROOT }}
        if: >-
          contains(matrix.modules, 'trino-redshift') &&
          (contains(matrix.profile, 'cloud-tests') || contains(matrix.profile, 'fte-tests')) &&
          (env.CI_SKIP_SECRETS_PRESENCE_CHECKS != '' || env.AWS_ACCESS_KEY_ID != '' || env.REDSHIFT_SUBNET_GROUP_NAME != '')
        run: |
          source .github/bin/redshift/setup-aws-redshift.sh

          $MAVEN test ${MAVEN_TEST} -pl ${{ matrix.modules }} ${{ format('-P {0}', matrix.profile) }} \
            -Dtest.redshift.jdbc.user="${REDSHIFT_USER}" \
            -Dtest.redshift.jdbc.password="${REDSHIFT_PASSWORD}" \
            -Dtest.redshift.jdbc.endpoint="${REDSHIFT_ENDPOINT}:${REDSHIFT_PORT}/" \
            -Dtest.redshift.s3.tpch.tables.root="${REDSHIFT_S3_TPCH_TABLES_ROOT}" \
            -Dtest.redshift.s3.unload.root="${REDSHIFT_S3_UNLOAD_ROOT}" \
            -Dtest.redshift.iam.role="${REDSHIFT_IAM_ROLES}" \
            -Dtest.redshift.aws.region="${AWS_REGION}" \
            -Dtest.redshift.aws.access-key="${AWS_ACCESS_KEY_ID}" \
            -Dtest.redshift.aws.secret-key="${AWS_SECRET_ACCESS_KEY}"
      - name: Cleanup ephemeral Redshift Cluster
        env:
          AWS_REGION: ${{ vars.REDSHIFT_AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ vars.REDSHIFT_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.REDSHIFT_AWS_SECRET_ACCESS_KEY }}
        # Cancelled workflows may have left the ephemeral cluster running
        if: always()
        run: .github/bin/redshift/delete-aws-redshift.sh
      - name: Sanitize artifact name
        if: always()
        run: |
          # Generate a valid artifact name and make it available to next steps as
          # an environment variable ARTIFACT_NAME
          # ", :, <, >, |, *, ?, \, / are not allowed in artifact names, replace it with an underscore
          name=$(echo -n "${{ matrix.modules }}, ${{ matrix.profile }}, ${{ matrix.jdk }}, ${{ matrix.cloud }}" | sed -e 's/[":<>|\*\?\\\/]/_/g')
          # final artifact name can't be longer than 128 characters
          echo "ARTIFACT_NAME=${name:0:100}" >> $GITHUB_ENV
      - name: Upload test results
        uses: ./.github/actions/process-test-results
        if: always()
        with:
          artifact-name: ${{ env.ARTIFACT_NAME }}
          has-failed-tests: >-
            ${{ steps.tests.outcome == 'failure'
              || steps.tests-starburst-functions.outcome == 'failure'
              || steps.tests-hdfs-isolated.outcome == 'failure'
              || steps.tests-s3.outcome == 'failure'
              || steps.tests-azure.outcome == 'failure'
              || steps.tests-buffer-trino-fs-cloud.outcome == 'failure'
              || steps.tests-filesystem-exchange.outcome == 'failure'
              || steps.tests-gcs.outcome == 'failure'
              || steps.tests-delta.outcome == 'failure'
              || steps.tests-objectstore.outcome == 'failure'
              || steps.tests-mongodb.outcome == 'failure'
              || steps.tests-bq.outcome == 'failure'
              || steps.tests-bq-smoke.outcome == 'failure'
              || steps.tests-google-sheets.outcome == 'failure'
              || steps.tests-iceberg.outcome == 'failure'
              || steps.tests-redshift.outcome == 'failure'
              || steps.tests-snowflake.outcome == 'failure'
            }}
          upload-heap-dump: ${{ env.SECRETS_PRESENT == '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - id: upload-test-results-datadog
        name: Upload test results to Datadog
        uses: ./.github/actions/upload-test-results-datadog
        if: always()
        with:
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
      - name: Launch Flake Tracker
        if: failure() && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: starburstdata/ai-flake-fixer/.github/actions/launch-ai-flake@main
        with:
          github-access-token: ${{ secrets.GITHUBACCESSTOKEN }}
      - name: Update PR check
        uses: ./.github/actions/update-check
        if: >-
          failure() &&
          github.event_name == 'repository_dispatch' &&
          github.event.client_payload.slash_command.args.named.sha != '' &&
          github.event.client_payload.pull_request.head.sha == github.event.client_payload.slash_command.args.named.sha
        with:
          pull_request_number: ${{ github.event.client_payload.pull_request.number }}
          check_name: ${{ github.job }} with secrets
          conclusion: ${{ job.status }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cancel merge queue workflow
        if: ${{ failure() && github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"

  gpu-tests:
    runs-on: [self-hosted, gha-fleet-ec2-1GPU-16CPU-64GB-amd64, latest]
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'gpu')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: |
            ${{ github.event_name == 'repository_dispatch' &&
                github.event.client_payload.pull_request.head.sha == github.event.client_payload.slash_command.args.named.sha &&
                format('refs/pull/{0}/head', github.event.client_payload.pull_request.number) || '' }}
      - name: Set up AWS code-artifacts and ECR login
        uses: ./.github/actions/starburst-setup
        with:
          aws-access-key-id: ${{ vars.ENG_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ENG_AWS_SECRET_ACCESS_KEY }}
          secret-id: ${{ vars.SEP_SECRETS_AWS_ID }}
          login-docker: true
      - uses: ./.github/actions/setup
      - name: Maven Install
        run: |
          export MAVEN_OPTS="${MAVEN_INSTALL_OPTS}"
          $MAVEN clean install -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dair.check.skip-all=true -Dskip.npm -Dskip.yarn -pl :trino-main,:trino-hive,:trino-tests -am
      - name: Maven Tests - core/trino-main
        run: $MAVEN test ${MAVEN_TEST} -pl core/trino-main -P gpu
      - name: Maven Tests - plugin/trino-hive
        run: $MAVEN test ${MAVEN_TEST} -pl plugin/trino-hive -P gpu
      - name: Maven Tests - testing/trino-tests
        run: $MAVEN test ${MAVEN_TEST} -pl testing/trino-tests -P gpu
      - name: Cancel merge queue workflow
        if: ${{ failure() && github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"

  build-pt:
    needs: path-filters
    if: github.event_name != 'pull_request' || needs.path-filters.outputs.non_docs == 'true'
    runs-on: [self-hosted, gha-fleet-ec2-8cpu-64gb-amd64, latest]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      product-tests-changed: ${{ steps.filter.outputs.product-tests }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # checkout all commits to be able to determine merge base for GIB
          ref: |
            ${{ github.event_name == 'repository_dispatch' &&
                github.event.client_payload.pull_request.head.sha == github.event.client_payload.slash_command.args.named.sha &&
                format('refs/pull/{0}/head', github.event.client_payload.pull_request.number) || '' }}
      # Only configure AWS creds here (not the full starburst-setup)
      # to avoid fetching secrets that would cause GitHub to mask "starburst" in job outputs
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6
        with:
          aws-access-key-id: ${{ vars.ENG_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ENG_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
          role-duration-seconds: 8000
      - uses: ./.github/actions/setup
        timeout-minutes: 15
        with:
          cache: restore
          cleanup-node: true
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            product-tests:
              - 'testing/trino-product-tests*/**'
              - 'testing/trino-testing-services/**'
              # run all tests when there are any changes in the trino-server Maven module
              # because it doesn't define it's Trino dependencies and
              # it relies on the Provisio plugin to find the right artifacts
              - 'core/trino-server/**'
              - '.github/**'
      - name: Maven Install
        run: |
          export MAVEN_OPTS="${MAVEN_INSTALL_OPTS}"
          $MAVEN clean install ${MAVEN_FAST_INSTALL} -pl '!:trino-docs'
      - name: Map impacted plugins to features
        run: |
          export MAVEN_OPTS="${MAVEN_INSTALL_OPTS}"
          # build a list of impacted modules, ignoring modules that cannot affect either product tests or Trino
          $MAVEN validate ${MAVEN_FAST_INSTALL} ${MAVEN_GIB} -Dgib.logImpactedTo=gib-impacted.log -pl '!:trino-docs,!:trino-tests,!:trino-faulttolerant-tests'
          # GIB doesn't run on master, so make sure the file always exist
          touch gib-impacted.log
          testing/trino-plugin-reader/target/trino-plugin-reader-*-executable.jar -i gib-impacted.log -p core/trino-server/target/trino-server-*-hardlinks/plugin > impacted-features.log
          echo "Impacted plugin features:"
          cat impacted-features.log
      - name: Product tests artifact
        uses: actions/upload-artifact@v7
        with:
          name: product tests and server tarball
          path: |
            core/trino-server/target/*.tar.gz
            impacted-features.log
            testing/trino-product-tests-launcher/target/*.jar
            testing/trino-product-tests/target/*-executable.jar
            client/trino-cli/target/*-executable.jar
          retention-days: 1
      - id: prepare-matrix-template
        run: |
          cat <<EOF > .github/test-pt-matrix.yaml
          config:
            - default
          suite:
            # Starburst suites
            - suite-objectstore
            - suite-sap-hana
            - suite-stargate
            # End of Starburst suites
            - suite-1
            - suite-2
            - suite-3
            # suite-4 does not exist
            - suite-5
            - suite-6-non-generic
            - suite-7-non-generic
            - suite-hive-transactional
            - suite-azure
            - suite-delta-lake-databricks133
            - suite-delta-lake-databricks143
            - suite-delta-lake-databricks154
            - suite-delta-lake-databricks164
            - suite-delta-lake-databricks173
            - suite-delta-lake-databricks-unity
            - suite-delta-lake-databricks-unity-s3-credentials-vending
            - suite-delta-lake-databricks-unity-gcs-credentials-vending
            - suite-hive-databricks-unity
            #- suite-exasol
            - suite-ranger
            - suite-gcs
            - suite-hive4
            - suite-clients
            - suite-functions
            - suite-kdb
            - suite-tpch
            - suite-tpcds
            - suite-storage-formats-detailed
            - suite-parquet
            - suite-oauth2
            - suite-ldap
            - suite-loki
            - suite-compatibility
            - suite-all-connectors-smoke
            - suite-delta-lake-oss
            - suite-kafka
            - suite-cassandra
            - suite-clickhouse
            - suite-mysql
            - suite-iceberg
            #- suite-snowflake # This is OSS Snowflake connector suite. We run Starburst Snowflake suite instead.
            - suite-hudi
            - suite-ignite
          exclude:
            - suite: suite-azure
              ignore exclusion if: >-
                ${{ env.CI_SKIP_SECRETS_PRESENCE_CHECKS != '' ||
                    vars.AZURE_ABFS_HIERARCHICAL_CONTAINER != '' ||
                    vars.AZURE_ABFS_HIERARCHICAL_ACCOUNT != '' ||
                    secrets.AZURE_ABFS_HIERARCHICAL_ACCESS_KEY != '' }}

            - suite: suite-gcs
              ignore exclusion if: >-
                ${{ env.CI_SKIP_SECRETS_PRESENCE_CHECKS != '' || secrets.GCP_CREDENTIALS_KEY != '' }}

            - suite: suite-delta-lake-databricks133
              ignore exclusion if: >-
                ${{ (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *') ||
                    (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'databricks')) ||
                    (github.event_name == 'workflow_dispatch') ||
                    (env.CI_SKIP_SECRETS_PRESENCE_CHECKS == '' && secrets.DATABRICKS_TOKEN == '') }}
            - suite: suite-delta-lake-databricks143
              ignore exclusion if: >-
                ${{ (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *') ||
                    (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'databricks')) ||
                    (github.event_name == 'workflow_dispatch') ||
                    (env.CI_SKIP_SECRETS_PRESENCE_CHECKS == '' && secrets.DATABRICKS_TOKEN == '') }}
            - suite: suite-delta-lake-databricks154
              ignore exclusion if: >-
                ${{ (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *') ||
                    (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'databricks')) ||
                    (github.event_name == 'workflow_dispatch') ||
                    (env.CI_SKIP_SECRETS_PRESENCE_CHECKS == '' && secrets.DATABRICKS_TOKEN == '') }}
            - suite: suite-delta-lake-databricks164
              ignore exclusion if: >-
                ${{ (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *') ||
                    (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'databricks')) ||
                    (github.event_name == 'workflow_dispatch') ||
                    (env.CI_SKIP_SECRETS_PRESENCE_CHECKS == '' && secrets.DATABRICKS_TOKEN == '') }}
            - suite: suite-delta-lake-databricks173
              ignore exclusion if: >-
                ${{ (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *') ||
                    (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'databricks')) ||
                    (github.event_name == 'workflow_dispatch') ||
                    (env.CI_SKIP_SECRETS_PRESENCE_CHECKS == '' && secrets.DATABRICKS_TOKEN == '') }}
            - suite: suite-delta-lake-databricks-unity
              config: hdp3
            - suite: suite-delta-lake-databricks-unity
              ignore exclusion if: >-
                ${{ (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *') ||
                    (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'databricks')) ||
                    (github.event_name == 'workflow_dispatch') ||
                    (env.CI_SKIP_SECRETS_PRESENCE_CHECKS == '' && secrets.DATABRICKS_TOKEN == '') }}
            - suite: suite-delta-lake-databricks-unity-s3-credentials-vending
              config: hdp3
            - suite: suite-delta-lake-databricks-unity-s3-credentials-vending
              ignore exclusion if: >-
                ${{ (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *') ||
                    (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'databricks')) ||
                    (github.event_name == 'workflow_dispatch') ||
                    (env.CI_SKIP_SECRETS_PRESENCE_CHECKS == '' && secrets.DATABRICKS_TOKEN == '') }}
            - suite: suite-delta-lake-databricks-unity-gcs-credentials-vending
              config: hdp3
            - suite: suite-delta-lake-databricks-unity-gcs-credentials-vending
              ignore exclusion if: >-
                ${{ (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *') ||
                    (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'databricks')) ||
                    (github.event_name == 'workflow_dispatch') ||
                    (env.CI_SKIP_SECRETS_PRESENCE_CHECKS == '' && secrets.DATABRICKS_TOKEN == '') }}
            - suite: suite-hive-databricks-unity
              config: hdp3
            - suite: suite-hive-databricks-unity
              ignore exclusion if: >-
                ${{ (github.event_name == 'schedule' && github.event.schedule == '0 0 * * *') ||
                    (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'databricks')) ||
                    (github.event_name == 'workflow_dispatch') ||
                    (env.CI_SKIP_SECRETS_PRESENCE_CHECKS == '' && secrets.DATABRICKS_TOKEN == '') }}
            - suite: suite-snowflake
              ignore exclusion if: >-
                ${{ env.CI_SKIP_SECRETS_PRESENCE_CHECKS != '' || secrets.SNOWFLAKE_PASSWORD != '' || env.SNOWFLAKE_PRIVATE_KEY != '' }}

          ignore exclusion if:
            # Do not use this property outside of the matrix configuration.
            #
            # This is added to all matrix entries so they may be conditionally
            # excluded by adding them to the excludes list with a GHA expression
            # for this property.
            # - If the expression evaluates to true, it will never match the a
            #   actual value of the property, and will therefore not be excluded.
            # - If the expression evaluates to false, it will match the actual
            #   value of the property, and the exclusion will apply normally.
            - "false"
          include:
            # this suite is designed specifically for apache-hive3. TODO remove the suite once we can run all regular tests on apache-hive3.
            - config: apache-hive3
              suite: suite-hms-only
            # Workaround for https://github.com/microsoft/mssql-docker/issues/899
            - config: default
              suite: suite-7-non-generic
              runson: ubuntu-20.04
            - config: default
              suite: suite-warp-speed
              runners: [ self-hosted, gha-fleet-ec2-8cpu-64gb-amd64, latest ]
            - config: default
              suite: suite-warp-speed-iceberg
              runners: [ self-hosted, gha-fleet-ec2-8cpu-64gb-amd64, latest ]
            - config: default
              suite: suite-warp-speed-delta-lake
              runners: [ self-hosted, gha-fleet-ec2-8cpu-64gb-amd64, latest ]

          EOF
      - name: Build PT matrix (all)
        if: |
          github.event_name != 'pull_request' ||
          steps.filter.outputs.product-tests == 'true' ||
          contains(github.event.pull_request.labels.*.name, 'tests:all') ||
          contains(github.event.pull_request.labels.*.name, 'tests:all-product')
        run: |
          # converts entire YAML file into JSON - no filtering since we want all PTs to run
          ./.github/bin/build-pt-matrix-from-impacted-connectors.py -v -m .github/test-pt-matrix.yaml -o matrix.json
      - name: Build PT matrix (impacted-features)
        if: |
          github.event_name == 'pull_request' &&
          steps.filter.outputs.product-tests == 'false' &&
          !contains(github.event.pull_request.labels.*.name, 'tests:all') &&
          !contains(github.event.pull_request.labels.*.name, 'product-tests:all')
        # all these envs are required to be set by some product test environments
        env:
          ABFS_CONTAINER: ""
          ABFS_ACCOUNT: ""
          ABFS_ACCESS_KEY: ""
          S3_BUCKET: ""
          AWS_REGION: ""
          TRINO_AWS_ACCESS_KEY_ID: ""
          TRINO_AWS_SECRET_ACCESS_KEY: ""
          DATABRICKS_AWS_REGION: ""
          DATABRICKS_133_JDBC_URL: ""
          DATABRICKS_143_JDBC_URL: ""
          DATABRICKS_154_JDBC_URL: ""
          DATABRICKS_164_JDBC_URL: ""
          DATABRICKS_173_JDBC_URL: ""
          DATABRICKS_UNITY_JDBC_URL: ""
          DATABRICKS_UNITY_CATALOG_NAME: ""
          DATABRICKS_UNITY_EXTERNAL_LOCATION: ""
          DATABRICKS_HOST: ""
          DATABRICKS_LOGIN: ""
          DATABRICKS_TOKEN: ""
          GCS_DATABRICKS_UNITY_JDBC_URL: ""
          GCS_DATABRICKS_UNITY_CATALOG_NAME: ""
          GCS_DATABRICKS_UNITY_EXTERNAL_LOCATION: ""
          GCS_DATABRICKS_HOST: ""
          GCS_DATABRICKS_LOGIN: ""
          GCS_DATABRICKS_TOKEN: ""
          DATABRICKS_UNITY_GCP_GCS_JSON_KEY: ""
          GCP_CREDENTIALS_KEY: ""
          GCP_STORAGE_BUCKET: ""
          SNOWFLAKE_ACCOUNT_NAME: ""
          SNOWFLAKE_URL: ""
          SNOWFLAKE_USER: ""
          SNOWFLAKE_PASSWORD: ""
          SNOWFLAKE_PRIVATE_KEY: ""
          SNOWFLAKE_PRIVATE_KEY_2: ""
          SNOWFLAKE_PRIVATE_KEY_2_PASSPHRASE: ""
          SNOWFLAKE_DATABASE: ""
          SNOWFLAKE_ROLE: ""
          SNOWFLAKE_WAREHOUSE: ""
          TESTCONTAINERS_NEVER_PULL: true
        run: |
          # converts filtered YAML file into JSON
          ./.github/bin/build-pt-matrix-from-impacted-connectors.py -v -m .github/test-pt-matrix.yaml -i impacted-features.log -o matrix.json
      - id: set-matrix
        run: |
          echo "Matrix: $(jq '.' matrix.json)"
          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT
      - name: Cancel merge queue workflow
        if: ${{ failure() && github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"

  pt:
    runs-on: ${{ matrix.runners != null && matrix.runners || fromJSON('["self-hosted", "gha-fleet-ec2-4cpu-16gb-amd64", "latest" ]') }}
    # explicitly define the name to avoid adding the value of the `ignore exclusion if` matrix item
    name: pt (${{ matrix.config }}, ${{ matrix.suite }}, ${{ matrix.jdk }})
    if: needs.build-pt.outputs.matrix != '{}'
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix: ${{ fromJson(needs.build-pt.outputs.matrix) }}
    # PT Launcher's timeout defaults to 2h, add some margin
    timeout-minutes: 130
    needs: build-pt
    env:
      REPORT_TEST_SESSION_NAME: pt
      REPORT_SERVICE_NAME: ${{ matrix.suite }}-${{ matrix.config }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # checkout all commits, as the build result depends on `git describe` equivalent
          ref: |
            ${{ github.event_name == 'repository_dispatch' &&
                github.event.client_payload.pull_request.head.sha == github.event.client_payload.slash_command.args.named.sha &&
                format('refs/pull/{0}/head', github.event.client_payload.pull_request.number) || '' }}
      - uses: ./.github/actions/setup
        timeout-minutes: 15
        with:
          # The job doesn't build anything, so the ~/.m2/repository cache isn't useful
          cache: 'false'
          cleanup-node: ${{ format('{0}', matrix.suite == 'suite-compatibility') }}
      - name: Run ECR login
        uses: ./.github/actions/starburst-setup
        with:
          aws-access-key-id: ${{ vars.ENG_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ENG_AWS_SECRET_ACCESS_KEY }}
          secret-id: ${{ vars.SEP_SECRETS_AWS_ID }}
          login-docker: true
      - name: Product tests artifact
        uses: actions/download-artifact@v8
        with:
          name: product tests and server tarball
      - name: Fix artifact permissions
        run: |
          find . -type f -name \*-executable.jar -exec chmod 0777 {} \;
      - name: Enable impact analysis
        if: |
          needs.build-pt.outputs.product-tests-changed == 'false' &&
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'tests:all') &&
          !contains(github.event.pull_request.labels.*.name, 'tests:all-product')
        run: echo "PTL_OPTS=--impacted-features impacted-features.log" >> $GITHUB_ENV
      - name: Product Tests
        id: tests
        env:
          ABFS_CONTAINER: ${{ vars.AZURE_ABFS_HIERARCHICAL_CONTAINER }}
          ABFS_ACCOUNT: ${{ vars.AZURE_ABFS_HIERARCHICAL_ACCOUNT }}
          ABFS_ACCESS_KEY: ${{ secrets.AZURE_ABFS_HIERARCHICAL_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ vars.TRINO_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRINO_AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ vars.TRINO_S3_BUCKET }}
          AWS_REGION: ${{ vars.TRINO_AWS_REGION }}
          TRINO_AWS_ACCESS_KEY_ID: ${{ vars.GALAXY_TRINO_DATABRICKS_AWS_ACCESS_KEY_ID }}
          TRINO_AWS_SECRET_ACCESS_KEY: ${{ secrets.GALAXY_TRINO_DATABRICKS_AWS_SECRET_ACCESS_KEY }}
          DATABRICKS_AWS_REGION: us-east-1
          DATABRICKS_133_JDBC_URL: ${{ vars.DATABRICKS_133_JDBC_URL }}
          DATABRICKS_143_JDBC_URL: ${{ vars.DATABRICKS_143_JDBC_URL }}
          DATABRICKS_154_JDBC_URL: ${{ vars.DATABRICKS_154_JDBC_URL }}
          DATABRICKS_164_JDBC_URL: ${{ vars.DATABRICKS_164_JDBC_URL }}
          DATABRICKS_173_JDBC_URL: ${{ vars.DATABRICKS_173_JDBC_URL }}
          DATABRICKS_UNITY_JDBC_URL: ${{ vars.DATABRICKS_UNITY_JDBC_URL }}
          DATABRICKS_UNITY_CATALOG_NAME: ${{ vars.DATABRICKS_UNITY_CATALOG_NAME }}
          DATABRICKS_UNITY_EXTERNAL_LOCATION: ${{ vars.DATABRICKS_UNITY_EXTERNAL_LOCATION }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_LOGIN: token
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_UNITY_GCP_GCS_JSON_KEY: ${{ secrets.DATABRICKS_UNITY_GCP_GCS_JSON_KEY }}
          GCS_DATABRICKS_UNITY_JDBC_URL: ${{ vars.GCS_DATABRICKS_UNITY_JDBC_URL }}
          GCS_DATABRICKS_UNITY_CATALOG_NAME: ${{ vars.GCS_DATABRICKS_UNITY_CATALOG_NAME }}
          GCS_DATABRICKS_UNITY_EXTERNAL_LOCATION: ${{ vars.GCS_DATABRICKS_UNITY_EXTERNAL_LOCATION }}
          GCS_DATABRICKS_HOST: ${{ vars.GCS_DATABRICKS_HOST }}
          GCS_DATABRICKS_LOGIN: token
          GCS_DATABRICKS_TOKEN: ${{ secrets.GCS_DATABRICKS_TOKEN }}
          SNOWFLAKE_ACCOUNT_NAME: ${{ vars.SNOWFLAKE_ACCOUNT_NAME }}
          GCP_CREDENTIALS_KEY: ${{ secrets.GCP_CREDENTIALS_KEY }}
          GCP_STORAGE_BUCKET: ${{ vars.GCP_STORAGE_BUCKET }}
          SNOWFLAKE_URL: ${{ vars.SNOWFLAKE_URL }}
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_2: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_2 }}
          SNOWFLAKE_PRIVATE_KEY_2_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_2_PASSPHRASE }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
        run: |
          exec testing/trino-product-tests-launcher/target/trino-product-tests-launcher-*-executable.jar suite run \
            --suite ${{ matrix.suite }} \
            --config config-${{ matrix.config }} \
            ${PTL_OPTS:-} \
            --bind=off --logs-dir logs/ --timeout 2h
      - name: Upload test results
        uses: ./.github/actions/process-test-results
        if: always()
        with:
          artifact-name: pt (${{ matrix.config }}, ${{ matrix.suite }}, ${{ matrix.jdk }})
          has-failed-tests: ${{ steps.tests.outcome == 'failure' }}
          upload-heap-dump: ${{ env.SECRETS_PRESENT == '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Upload test results to Datadog
        uses: ./.github/actions/upload-test-results-datadog
        if: always()
        with:
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
      - name: Update PR check
        uses: ./.github/actions/update-check
        if: >-
          failure() &&
          github.event_name == 'repository_dispatch' &&
          github.event.client_payload.slash_command.args.named.sha != '' &&
          github.event.client_payload.pull_request.head.sha == github.event.client_payload.slash_command.args.named.sha
        with:
          pull_request_number: ${{ github.event.client_payload.pull_request.number }}
          check_name: ${{ github.job }} with secrets
          conclusion: ${{ job.status }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Should notify on failure
        id: should_notify
        if: always() && steps.tests.outcome == 'failure' && contains(matrix.suite, 'databricks')
        run: |
          # GITHUB_HEAD_REF is only populated for pull requests runs, for scheduled runs extract the name from GITHUB_REF
          branch_name="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          echo "branch=$branch_name" >> "${GITHUB_OUTPUT}"
          if [[ $branch_name == "master" || $branch_name =~ ^release-.*-e$ ]]; then
            echo "result=true" >> "${GITHUB_OUTPUT}"
          else
            echo "result=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Slack notify failed tests to Connectors team
        if: always() && steps.tests.outcome == 'failure' && contains(matrix.suite, 'databricks') && steps.should_notify.outputs.result == 'true'
        uses: archive/github-actions-slack@433fef9978d3adae73168bfc9c5a7ce722780231 # v3.1.0
        with:
          slack-bot-user-oauth-access-token: ${{ secrets.SLACK_TOKEN }}
          slack-channel: C09HT9ETS73 # team-connectors-notify channel ID
          slack-text: |
            :boom: Databricks PT failed: ${{ matrix.suite }} on branch: ${{ steps.should_notify.outputs.branch }} (<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|see CI job for details>) (:thumbsup: this message if you take care of this)
      - name: Launch Flake Tracker
        if: failure() && steps.tests.outcome == 'failure' && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: starburstdata/ai-flake-fixer/.github/actions/launch-ai-flake@main
        with:
          github-access-token: ${{ secrets.GITHUBACCESSTOKEN }}
      - name: Cancel merge queue workflow
        if: ${{ failure() && github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"

  build-success:
    if: ${{ always() }} # if `failure()` would not work for cancellations, `!success()` would not work for skipped jobs
    runs-on: [self-hosted, gha-fleet-ec2-2cpu-8gb-amd64, latest]
    needs:
      - artifact-checks
      - bigquery-tests
      - build-pt
      - build-test-matrix
      - check-commit
      - check-commits-dispatcher
      - error-prone-checks
      - google-sheets-tests
      - gpu-tests
      - hive-tests
      - maven-checks
      - path-filters
      - pt
      - redshift-cloud-tests
      - redshift-fte-tests
      - salesforce-tests
      - snowflake-nightly-tests
      - snowflake-weekly-tests
      - starburst-functions-ai-tests
      - synapse-prepare
      - synapse-stop-pool
      - synapse-tests
      - test
      - test-jdbc-compatibility
      - test-other-modules
    steps:
      - name: "Check results"
        run: |
          # generated by TestCiWorkflow
          echo '${{ needs.artifact-checks.result }}' | grep -xE 'success|skipped' || { echo 'Job "artifact-checks" failed' >&2; exit 1; }
          echo '${{ needs.bigquery-tests.result }}' | grep -xE 'success|skipped' || { echo 'Job "bigquery-tests" failed' >&2; exit 1; }
          echo '${{ needs.build-pt.result }}' | grep -xE 'success|skipped' || { echo 'Job "build-pt" failed' >&2; exit 1; }
          echo '${{ needs.build-test-matrix.result }}' | grep -xE 'success|skipped' || { echo 'Job "build-test-matrix" failed' >&2; exit 1; }
          echo '${{ needs.check-commit.result }}' | grep -xE 'success|skipped' || { echo 'Job "check-commit" failed' >&2; exit 1; }
          echo '${{ needs.check-commits-dispatcher.result }}' | grep -xE 'success|skipped' || { echo 'Job "check-commits-dispatcher" failed' >&2; exit 1; }
          echo '${{ needs.error-prone-checks.result }}' | grep -xE 'success|skipped' || { echo 'Job "error-prone-checks" failed' >&2; exit 1; }
          echo '${{ needs.google-sheets-tests.result }}' | grep -xE 'success|skipped' || { echo 'Job "google-sheets-tests" failed' >&2; exit 1; }
          echo '${{ needs.gpu-tests.result }}' | grep -xE 'success|skipped' || { echo 'Job "gpu-tests" failed' >&2; exit 1; }
          echo '${{ needs.hive-tests.result }}' | grep -xE 'success|skipped' || { echo 'Job "hive-tests" failed' >&2; exit 1; }
          echo '${{ needs.maven-checks.result }}' | grep -xE 'success|skipped' || { echo 'Job "maven-checks" failed' >&2; exit 1; }
          echo '${{ needs.path-filters.result }}' | grep -xE 'success|skipped' || { echo 'Job "path-filters" failed' >&2; exit 1; }
          echo '${{ needs.pt.result }}' | grep -xE 'success|skipped' || { echo 'Job "pt" failed' >&2; exit 1; }
          echo '${{ needs.redshift-cloud-tests.result }}' | grep -xE 'success|skipped' || { echo 'Job "redshift-cloud-tests" failed' >&2; exit 1; }
          echo '${{ needs.redshift-fte-tests.result }}' | grep -xE 'success|skipped' || { echo 'Job "redshift-fte-tests" failed' >&2; exit 1; }
          echo '${{ needs.salesforce-tests.result }}' | grep -xE 'success|skipped' || { echo 'Job "salesforce-tests" failed' >&2; exit 1; }
          echo '${{ needs.snowflake-nightly-tests.result }}' | grep -xE 'success|skipped' || { echo 'Job "snowflake-nightly-tests" failed' >&2; exit 1; }
          echo '${{ needs.snowflake-weekly-tests.result }}' | grep -xE 'success|skipped' || { echo 'Job "snowflake-weekly-tests" failed' >&2; exit 1; }
          echo '${{ needs.starburst-functions-ai-tests.result }}' | grep -xE 'success|skipped' || { echo 'Job "starburst-functions-ai-tests" failed' >&2; exit 1; }
          echo '${{ needs.synapse-prepare.result }}' | grep -xE 'success|skipped' || { echo 'Job "synapse-prepare" failed' >&2; exit 1; }
          echo '${{ needs.synapse-stop-pool.result }}' | grep -xE 'success|skipped' || { echo 'Job "synapse-stop-pool" failed' >&2; exit 1; }
          echo '${{ needs.synapse-tests.result }}' | grep -xE 'success|skipped' || { echo 'Job "synapse-tests" failed' >&2; exit 1; }
          echo '${{ needs.test.result }}' | grep -xE 'success|skipped' || { echo 'Job "test" failed' >&2; exit 1; }
          echo '${{ needs.test-jdbc-compatibility.result }}' | grep -xE 'success|skipped' || { echo 'Job "test-jdbc-compatibility" failed' >&2; exit 1; }
          echo '${{ needs.test-other-modules.result }}' | grep -xE 'success|skipped' || { echo 'Job "test-other-modules" failed' >&2; exit 1; }
