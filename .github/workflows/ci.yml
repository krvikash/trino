  starburst-functions-ai-tests:
    runs-on: [self-hosted, gha-fleet-ec2-16cpu-64gb-amd64, latest]
    timeout-minutes: 60
    env:
      REPORT_TEST_SESSION_NAME: modules
      REPORT_SERVICE_NAME: starburst-functions-ai
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AZURE_OPEN_AI_LANGUAGE_ENDPOINT: ${{ vars.AZURE_OPEN_AI_LANGUAGE_ENDPOINT }}
      AZURE_OPEN_AI_EMBED_ENDPOINT: ${{ vars.AZURE_OPEN_AI_EMBED_ENDPOINT }}
      AZURE_OPEN_AI_API_KEY: ${{ secrets.AZURE_OPEN_AI_API_KEY }}
      OPEN_AI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
      BEDROCK_ACCESS_KEY_ID: ${{ vars.BEDROCK_ACCESS_KEY_ID }}
      BEDROCK_SECRET_ACCESS_KEY: ${{ secrets.BEDROCK_SECRET_ACCESS_KEY }}
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/master' ||
      github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ai')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # checkout all commits to be able to determine merge base for GIB
          ref: |
            ${{ github.event_name == 'repository_dispatch' &&
                github.event.client_payload.pull_request.head.sha == github.event.client_payload.slash_command.args.named.sha &&
                format('refs/pull/{0}/head', github.event.client_payload.pull_request.number) || '' }}
      - name: Set up AWS code-artifacts login
        uses: ./.github/actions/starburst-setup
        with:
          aws-access-key-id: ${{ vars.ENG_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ENG_AWS_SECRET_ACCESS_KEY }}
          secret-id: ${{ vars.SEP_SECRETS_AWS_ID }}
          login-docker: true
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          cache: restore
          cleanup-node: true
      - name: Validate Environment Variables
        run: |
          missing_vars=()
          for var in GEMINI_API_KEY AZURE_OPEN_AI_LANGUAGE_ENDPOINT AZURE_OPEN_AI_EMBED_ENDPOINT AZURE_OPEN_AI_API_KEY OPEN_AI_API_KEY BEDROCK_ACCESS_KEY_ID BEDROCK_SECRET_ACCESS_KEY; do
            if [[ -z "${!var}" ]]; then
              missing_vars+=("$var")
            fi
          done
          if [[ ${#missing_vars[@]} -gt 0 ]]; then
            echo "Error: Required environment variables are missing: ${missing_vars[*]}"
            exit 1
          fi
      - name: Maven Install
        run: |
          export MAVEN_OPTS="${MAVEN_INSTALL_OPTS}"
          $MAVEN clean install ${MAVEN_FAST_INSTALL} ${MAVEN_GIB} -pl '!:trino-docs,!:trino-server'
