          upload-heap-dump: ${{ env.SECRETS_PRESENT == '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
      - name: Upload test results to Datadog
        uses: ./.github/actions/upload-test-results-datadog
        if: always()
        with:
          datadog-api-key: ${{ secrets.DATADOG_API_KEY }}
      - name: Launch Flake Tracker
        if: failure() && steps.tests.outcome == 'failure' && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: starburstdata/ai-flake-fixer/.github/actions/launch-ai-flake@main
        with:
          github-access-token: ${{ secrets.GITHUBACCESSTOKEN }}
      - name: Cancel merge queue workflow
        if: ${{ failure() && github.event_name == 'merge_group' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel "${GITHUB_RUN_ID}" --repo "${GITHUB_REPOSITORY}"

  build-test-matrix:
    needs: path-filters
    if: github.event_name != 'pull_request' || needs.path-filters.outputs.non_docs == 'true'
    runs-on: [self-hosted, gha-fleet-ec2-2cpu-8gb-amd64, latest]
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # checkout all commits to be able to determine merge base for GIB
          ref: |
            ${{ github.event_name == 'repository_dispatch' &&
                github.event.client_payload.pull_request.head.sha == github.event.client_payload.slash_command.args.named.sha &&
                format('refs/pull/{0}/head', github.event.client_payload.pull_request.number) || '' }}
      # Only configure AWS creds here (not the full starburst-setup)
      # to avoid fetching secrets that would cause GitHub to mask "starburst" in job outputs
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6
        with:
          aws-access-key-id: ${{ vars.ENG_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ENG_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
          role-duration-seconds: 8000
      - uses: ./.github/actions/setup
        timeout-minutes: 15
        with:
          cache: restore
      - name: Update PR check
        uses: ./.github/actions/update-check
        if: >-
          github.event_name == 'repository_dispatch' &&
          github.event.client_payload.slash_command.args.named.sha != '' &&
          github.event.client_payload.pull_request.head.sha == github.event.client_payload.slash_command.args.named.sha
        with:
          pull_request_number: ${{ github.event.client_payload.pull_request.number }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Maven validate
