# Caller workflow for Notable Changes analysis using reusable workflow
# See https://github.com/starburstdata/notable-changes-workflow for configuration options

name: Notable Change

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to analyze'
        required: true
        type: number

permissions:
  pull-requests: write
  contents: read
  issues: write
  id-token: write

jobs:
  check-trigger:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       (contains(github.event.comment.body, '/generate-metadata') ||
        contains(github.event.comment.body, '/regenerate') ||
        contains(github.event.comment.body, '/accept')))
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - name: Determine PR number
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const eventName = context.eventName;
            let prNumber = 0;
            let shouldRun = false;

            if (eventName === 'workflow_dispatch') {
              prNumber = parseInt('${{ inputs.pr_number }}') || 0;
              shouldRun = prNumber > 0;
            } else {
              prNumber = context.issue.number;
              shouldRun = true;
            }

            core.setOutput('should_run', shouldRun ? 'true' : 'false');
            core.setOutput('pr_number', prNumber);

  analyze:
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    uses: starburstdata/notable-changes-workflow/.github/workflows/notable-changes.yaml@main
    with:
      secrets-manager-arn: 'arn:aws:secretsmanager:us-east-2:843985043183:secret:sep-ci/sep/cork'
      github-token-env-var: 'SEP_CI_SEP_CORK_GITHUB_ACCESS_TOKEN'
      pr-number: ${{ needs.check-trigger.outputs.pr_number }}
      enable-external-context: true
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.ENG_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ENG_AWS_SECRET_ACCESS_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_EMAIL_USER: ${{ secrets.JIRA_EMAIL_USER }}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
