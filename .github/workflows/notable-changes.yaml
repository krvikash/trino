# Caller workflow for Notable Changes analysis using reusable workflow
# See https://github.com/starburstdata/notable-changes-workflow for configuration options

name: Notable Change

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master, release-**]
  pull_request_review:
    types: [submitted]
    branches: [master, release-**]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to analyze'
        required: true
        type: number

permissions:
  pull-requests: write
  contents: read
  issues: write
  id-token: write

jobs:
  check-trigger:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'approved') ||
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
       (contains(github.event.comment.body, '/generate-metadata') ||
        contains(github.event.comment.body, '/regenerate') ||
        contains(github.event.comment.body, '/accept')))
    runs-on: ["self-hosted", "gha-fleet-ec2-2cpu-8gb-amd64", "latest"]
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - uses: starburstdata/notable-changes-workflow/.github/actions/check-trigger@main
        id: check
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number-override: ${{ inputs.pr_number }}

  analyze:
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    uses: starburstdata/notable-changes-workflow/.github/workflows/notable-changes.yaml@main
    with:
      pr-number: ${{ needs.check-trigger.outputs.pr_number }}
      claude-md-path: '.github/notable-changes/CLAUDE.md'
      enable-external-context: true
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.ENG_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ENG_AWS_SECRET_ACCESS_KEY }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_EMAIL_USER: ${{ secrets.JIRA_EMAIL_USER }}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

  notify-failure:
    needs: [ check-trigger, analyze ]
    if: |
      always() &&
      needs.check-trigger.outputs.should_run == 'true' &&
      needs.analyze.result == 'failure'
    runs-on: [ "self-hosted", "gha-fleet-ec2-2cpu-8gb-amd64", "latest" ]
    steps:
      - uses: starburstdata/notable-changes-workflow/.github/actions/notify-failure@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ needs.check-trigger.outputs.pr_number }}
