$schema: "http://json-schema.org"
description: >-
  Configuration for the scheduling of tests in CI.

  CI runs tests on pushes to master and release branches, on updates to pull requests, on manual
  dispatches, and on a nightly schedule. This configuration allows specifying which tests run in
  each of these events.
type: array
items:
  type: object
  description: A set of tests that run in the same conditions
  additionalProperties: false
  required: [modules]
  properties:
    modules:
      description: A set of maven modules to test
      type: array
      minItems: 1
      items:
        type: string
    profiles:
      description: >-
        A set of maven profiles to test. If empty, one job will be run for each module in modules,
        running the default profile tests. Otherwise, one job will be run for each pair of module
        and profile.
      type: array
      items:
        type: string
    runners:
      description: Runner labels to apply to the jobs created by this set of tests
      type: array
      items:
        type: string

    when:
      type: object
      description: >-
        Filters on when these tests run. If left unspecified, behaves the same as if set to
        { pushes: true }. That is, tests will run unless impact detection ran and didn't detect
        impact to the module.
      additionalProperties: false
      properties:
        pushes:
          description: >-
            Whether to run these tests on any push to main branches (or addition to merge queue).
            Default: false
          type: boolean
        dispatches:
          description: >-
            Whether to run these tests on manual dispatches (workflow_dispatch and
            repository_dispatch events). Default: true
          type: boolean
        impacted:
          description: >-
            Whether to run tests for impacted modules in this set. Generally, should be true,
            except in specific cases where other tests for the modules run and these are
            particularly expensive or long-running. Default: true
          type: boolean
        scheduled:
          description: >-
            The scheduled run types on which to run these tests. Default: nightly
          type: string
          enum: [nightly, weekly, never]
        labeled:
          description: A set of labels which force these tests to run
          type: array
          items:
            type: string
