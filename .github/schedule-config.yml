- { modules: plugin/starburst-stargate, runners: [self-hosted, gha-fleet-ec2-2cpu-8gb-amd64, latest], when: {scheduled: nightly} }
- { modules: plugin/starburst-stargate-parallel, runners: [self-hosted, gha-fleet-ec2-4cpu-16gb-amd64, latest], when: {scheduled: nightly} }
- { modules: plugin/trino-mongodb, profile: cloud-tests, when: {scheduled: nightly} }
- { modules: plugin/trino-pinot, runners: [self-hosted, gha-fleet-ec2-8cpu-64gb-amd64, latest], when: {scheduled: nightly} }
- { modules: plugin/trino-bigquery, profile: default, notify-channels: [C09HT9ETS73], when: {scheduled: nightly, labeled: [bigquery]} } # team-connectors-notify
- { modules: plugin/trino-bigquery, profile: cloud-tests-1, notify-channels: [C09HT9ETS73], when: {scheduled: nightly, labeled: [bigquery]} } # team-connectors-notify
- { modules: plugin/trino-bigquery, profile: cloud-tests-2, notify-channels: [C09HT9ETS73], when: {scheduled: nightly, labeled: [bigquery]} } # team-connectors-notify
- { modules: plugin/trino-google-sheets, profile: "", notify-channels: [C09HT9ETS73], when: {scheduled: nightly, labeled: [google-sheets]} } # team-connectors-notify
- { modules: plugin/trino-google-sheets, profile: cloud-tests, notify-channels: [C09HT9ETS73], when: {scheduled: nightly, labeled: [google-sheets]} } # team-connectors-notify
- { modules: plugin/trino-redshift, profile: "", notify-channels: [C09HT9ETS73], when: {scheduled: nightly, labeled: [redshift]} } # team-connectors-notify
- { modules: plugin/trino-redshift, profile: cloud-tests, notify-channels: [C09HT9ETS73], when: {scheduled: nightly, labeled: [redshift]} } # team-connectors-notify
- { modules: plugin/trino-redshift, profile: fte-tests, notify-channels: [C09HT9ETS73], when: {scheduled: nightly, labeled: [redshift]} } # team-connectors-notify
- { modules: plugin/starburst-salesforce, notify-channels: [C09HT9ETS73], when: {scheduled: nightly, labeled: [salesforce], impacted: false} } # team-connectors-notify
- { modules: plugin/starburst-salesforce-cdp, notify-channels: [C09HT9ETS73], when: {scheduled: nightly} } # team-connectors-notify
- modules:
    - plugin/starburst-snowflake
  profile: smoke-tests
  matrix-properties:
    cloud: amazon-web-service
  notify-channels:
    - C09HT9ETS73 # team-connectors-notify
  when:
    scheduled: nightly
    labeled: [snowflake]
    dispatches: false
    impacted: false
## Weekly
