- modules:
    - plugin/starburst-snowflake
  profile: default
  matrix-properties:
    cloud: azure
  notify-channels:
    - C09HT9ETS73 # team-connectors-notify
  when:
    scheduled: weekly
    labeled: [snowflake]
    dispatches: false
    impacted: false
- modules:
    - plugin/starburst-snowflake
  profile: smoke-tests
  matrix-properties:
    cloud: azure
  notify-channels:
