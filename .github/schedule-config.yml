# Install a YAML language server in your IDE to validate against the schema, or use a tool
# like https://github.com/yaml-schema/yaml-schema
# yaml-language-server: $schema=./schedule-config-schema.yml

- modules:
    - core/trino-main
- modules:
    - client/trino-jdbc
    - core/trino-spi
    - core/trino-web-ui
    - plugin/starburst-base-jdbc
- modules:
    - plugin/trino-base-jdbc
    - plugin/trino-faker
    - plugin/trino-geospatial
    - plugin/trino-memory
    - plugin/trino-openlineage
    - plugin/trino-thrift
- modules:
    - lib/trino-orc
    - lib/trino-parquet
- modules:
    - lib/trino-filesystem
    - lib/trino-filesystem-azure
    - lib/trino-filesystem-gcs
    - lib/trino-filesystem-manager
    - lib/trino-filesystem-s3
    - lib/trino-hdfs
    - lib/trino-hive-formats
    - plugin/trino-blob-cache-alluxio
    - plugin/trino-blob-cache-memory
- modules:
    - plugin/starburst-warp-speed/starburst-warp-speed-core
    - plugin/starburst-warp-speed/starburst-warp-speed-extensions
    - plugin/starburst-warp-speed/starburst-warp-speed-plugin
- modules:
    # trino-main takes about as long as all the other modules combined, so it runs in its own job
    - - core/trino-main
    - - plugin/trino-hive
      - plugin/trino-iceberg
      - plugin/trino-delta-lake
      - plugin/starburst-objectstore
      - testing/trino-tests
  profile: gpu
  runners: [self-hosted, gha-fleet-ec2-1GPU-16CPU-64GB-amd64, latest]
  timeout-minutes: 45
  when:
    pushes: true
    labeled: [gpu]
- { modules: lib/trino-filesystem-azure, profile: cloud-tests }
- { modules: lib/trino-filesystem-gcs, profile: cloud-tests }
- { modules: lib/trino-filesystem-s3, profile: cloud-tests }
- { modules: plugin/trino-exchange-filesystem, profile: cloud-tests }
- { modules: starburst-buffer-service/starburst-buffer-data-server, profile: cloud-tests }
- { modules: lib/starburst-functions-client }
- { modules: [lib/starburst-materialization-metastore-api, lib/starburst-materialization-metastore-server] }
- { modules: plugin/starburst-functions }
- { modules: plugin/starburst-objectstore, profile: "", runners: [self-hosted, gha-fleet-ec2-8cpu-64gb-amd64, latest] }
- { modules: plugin/starburst-objectstore, profile: hive-tests, runners: [self-hosted, gha-fleet-ec2-8cpu-64gb-amd64, latest] }
- { modules: plugin/starburst-objectstore, profile: iceberg-delta, runners: [self-hosted, gha-fleet-ec2-16cpu-64gb-amd64, latest] }
- { modules: plugin/starburst-objectstore, profile: cloud-tests, runners: [self-hosted, gha-fleet-ec2-2cpu-8gb-amd64, latest] }
- { modules: plugin/trino-delta-lake, runners: [self-hosted, gha-fleet-ec2-16cpu-64gb-amd64, latest] }
- { modules: plugin/trino-delta-lake, profile: cloud-tests }
- { modules: plugin/trino-delta-lake, profile: fte-tests }
- { modules: starburst-buffer-service/starburst-buffer-exchange-tests, profile: "" }
- { modules: starburst-buffer-service/starburst-buffer-exchange-tests, profile: test-buffer-exchange-failure-recovery }
- { modules: plugin/trino-hive, runners: [self-hosted, gha-fleet-ec2-16cpu-64gb-amd64, latest] }
- { modules: plugin/trino-hive, profile: cloud-tests }
- { modules: plugin/trino-hive, profile: fte-tests }
- { modules: plugin/trino-hive, profile: test-parquet }
- { modules: plugin/trino-iceberg, runners: [self-hosted, gha-fleet-ec2-16cpu-64gb-amd64, latest] }
- { modules: plugin/trino-iceberg, profile: cloud-tests }
- { modules: plugin/trino-iceberg, profile: fte-tests }
- { modules: plugin/trino-iceberg, profile: floci-and-avro }
# biglake-tests runs on nightly schedule only
- { modules: testing/trino-faulttolerant-tests, profile: default }
- { modules: testing/trino-faulttolerant-tests, profile: test-fault-tolerant-delta }
- { modules: testing/trino-faulttolerant-tests, profile: test-fault-tolerant-hive }
- { modules: testing/trino-faulttolerant-tests, profile: test-fault-tolerant-iceberg }
- modules:
    - testing/trino-tests
  runners: [self-hosted, gha-fleet-ec2-16cpu-64gb-amd64, latest]
  matrix-properties:
    buildAll: true # buildAll is needed to build and package plugins required by TestConnectorSensitiveProperties
- { modules: plugin/trino-ignite }
- { modules: plugin/trino-postgresql }
- { modules: plugin/trino-redis }
- { modules: plugin/trino-resource-group-managers }
## Nightly
- { modules: plugin/starburst-dynamodb, when: {scheduled: nightly} }
- { modules: plugin/starburst-oracle, when: {scheduled: nightly} }
- { modules: plugin/starburst-sap-hana, when: {scheduled: nightly} }
- { modules: plugin/starburst-sqlserver, when: {scheduled: nightly} }
- { modules: plugin/trino-elasticsearch, when: {scheduled: nightly} }
- { modules: plugin/trino-clickhouse, when: {scheduled: nightly} }
- { modules: plugin/trino-kafka, when: {scheduled: nightly} }
- { modules: plugin/trino-mariadb, when: {scheduled: nightly} }
- { modules: plugin/trino-mysql, when: {scheduled: nightly} }
- { modules: plugin/trino-oracle, when: {scheduled: nightly} }
- { modules: plugin/trino-sqlserver, when: {scheduled: nightly} }
