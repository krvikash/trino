connector.name=delta_lake
hive.metastore=unity
hive.metastore.unity.host=${ENV:GCS_DATABRICKS_HOST}
hive.metastore.unity.token=${ENV:GCS_DATABRICKS_TOKEN}
hive.metastore.unity.catalog-name=${ENV:DATABRICKS_UNITY_CATALOG_NAME}
hive.metastore.unity.catalog-owned-table-enabled=true
hive.metastore.unity.vended-credentials-enabled=true
delta.security=allow-all
fs.hadoop.enabled=false
fs.native-gcs.enabled=true
delta.enable-non-concurrent-writes=true
